<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Acionamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B12;--panel:#0C121C;--panel2:#101827;--panel3:#16202F;
  --line:#1A2433;--line2:#243247;
  --amber:#FFB020;--cyan:#22D3EE;--green:#34D399;--red:#F43F5E;--violet:#A78BFA;
  --txt:#E8EFF7;--dim:#7C8FA6;--faint:#48596E;
  --mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(900px 420px at 85% -6%,rgba(255,176,32,.045),transparent 62%),var(--bg);
  color:var(--txt);font-family:var(--mono);font-size:13px;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 64px}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.n{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.prose{font-family:var(--sans)}
.hd{border-bottom:1px solid var(--line);padding:18px 0 16px;margin-bottom:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hd-mk{width:38px;height:38px;border:1px solid var(--amber);color:var(--amber);background:rgba(255,176,32,.07);
  display:flex;align-items:center;justify-content:center;font-weight:800}
.hd h1{font-size:16px;font-weight:700;letter-spacing:.03em}.hd h1 em{font-style:normal;color:var(--amber)}
.hd .m{font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-top:5px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);background:var(--line);gap:1px}
.k{background:var(--panel);padding:14px 15px 12px;min-height:86px}
.k .l{font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
.k .v{font-size:22px;font-weight:700;margin-top:9px;line-height:1}
.k .d{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;margin-top:8px;font-weight:700;color:var(--dim)}
.pn{border:1px solid var(--line);background:var(--panel);margin-top:16px}
.pn-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pn-h h3{font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.pn-h .nt{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.pn-b{padding:16px}
.cad{border:1px solid var(--line);background:var(--panel);border-top:2px solid var(--amber);padding:30px;max-width:430px;margin:40px auto;text-align:center}
.cad h3{font-size:12px;font-weight:700;letter-spacing:.05em;margin-bottom:8px}
.cad p{font-family:var(--sans);font-size:12px;line-height:1.6;color:var(--dim);margin-bottom:18px}
.cad input{width:100%;background:#070B12;border:1px solid var(--line2);color:var(--txt);font-family:var(--mono);font-size:14px;letter-spacing:.2em;padding:12px;text-align:center}
.cad input:focus{outline:none;border-color:var(--amber)}
.btn{background:var(--amber);color:#0A0703;padding:12px;border:none;font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.cad .btn{width:100%;margin-top:12px}
.msg{min-height:15px;margin-top:11px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.msg.err{color:var(--red)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.chipf{background:var(--panel);border:1px solid var(--line2);color:var(--dim);font-family:var(--mono);font-size:9.5px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;padding:8px 11px;cursor:pointer}
.chipf b{color:var(--txt);margin-left:6px}
.chipf.on{border-color:var(--amber);color:var(--amber)}
.busca{margin-left:auto;background:#070B12;border:1px solid var(--line2);color:var(--txt);font-family:var(--mono);font-size:12px;padding:8px 11px;min-width:220px}
.busca:focus{outline:none;border-color:var(--amber)}
.grp{margin-top:18px}
.grp-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.grp-h .t{font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--c)}
.grp-h .s{font-family:var(--sans);font-size:12px;color:var(--dim)}
.cli{border:1px solid var(--line);background:var(--panel);border-left:2px solid var(--c);padding:13px 15px;margin-bottom:8px;
  display:grid;grid-template-columns:minmax(220px,1.4fr) minmax(200px,1.2fr) minmax(230px,1fr);gap:16px;align-items:start}
.cli.feito{opacity:.55}
.cli .nm{font-size:13px;font-weight:700;letter-spacing:.01em}
.cli .sub{font-size:10px;color:var(--faint);letter-spacing:.06em;margin-top:4px;line-height:1.7}
.cli .sub b{color:var(--dim);font-weight:600}
.cli .vl{font-size:17px;font-weight:800;margin-top:8px}
.tag{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.08em;padding:2px 7px;text-transform:uppercase;margin:6px 6px 0 0}
.tag.hoje{background:rgba(244,63,94,.14);color:var(--red)}
.tag.venc{background:rgba(167,139,250,.14);color:var(--violet)}
.tag.prox{background:rgba(255,176,32,.13);color:var(--amber)}
.tag.ok{background:rgba(52,211,153,.13);color:var(--green)}
.tag.cz{background:var(--panel3);color:var(--dim)}
.fones{display:flex;flex-direction:column;gap:6px}
.fone{display:flex;align-items:center;gap:6px}
.fone .nb{font-size:11.5px;min-width:112px}
.fone a{display:inline-flex;align-items:center;justify-content:center;height:26px;padding:0 9px;border:1px solid var(--line2);
  text-decoration:none;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.fone a.wa{color:#25D366}.fone a.wa:hover{background:rgba(37,211,102,.14);border-color:#25D366}
.fone a.tel{color:var(--cyan)}.fone a.tel:hover{background:rgba(34,211,238,.14);border-color:var(--cyan)}
.cp{margin-top:8px;background:none;border:1px dashed var(--line2);color:var(--dim);font-family:var(--mono);font-size:9.5px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;cursor:pointer}
.cp:hover{color:var(--amber);border-color:var(--amber)}
.mot{font-family:var(--sans);font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.5}
.mot b{color:var(--txt);font-weight:600}
.st{display:flex;flex-wrap:wrap;gap:5px}
.st button{background:none;border:1px solid var(--line2);color:var(--dim);font-family:var(--mono);font-size:9px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;cursor:pointer}
.st button:hover{border-color:var(--dim);color:var(--txt)}
.st button.on{color:#0A0703;border-color:transparent}
.st input{width:100%;margin-top:6px;background:#070B12;border:1px solid var(--line2);color:var(--txt);font-family:var(--sans);font-size:11.5px;padding:7px 9px}
.st .hist{width:100%;font-size:9.5px;color:var(--faint);letter-spacing:.05em;margin-top:5px}
details.tpl{margin-top:16px;border:1px solid var(--line);background:var(--panel)}
details.tpl summary{padding:13px 16px;cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
details.tpl .pn-b label{display:block;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:12px 0 6px}
details.tpl textarea{width:100%;min-height:74px;background:#070B12;border:1px solid var(--line2);color:var(--txt);font-family:var(--sans);font-size:12.5px;line-height:1.5;padding:10px}
.ft{margin-top:26px;padding:15px 18px;border:1px dashed var(--line2);font-family:var(--sans);font-size:11px;line-height:1.7;color:var(--faint)}
.ft b{color:var(--dim)}
.vazio{padding:30px;text-align:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
@media(max-width:980px){.cli{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.busca{margin-left:0;width:100%}}
</style>
</head>

<script>
(function(){
'use strict';
const D=JSON.parse(document.getElementById('dd').textContent);
const R=document.getElementById('r');
const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const brl0=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(v||0);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
const hojeD=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const hojeISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dias=br=>{if(!br)return null;const[d,m,y]=br.split('/').map(Number);return Math.round((new Date(y,m-1,d)-hojeD())/86400000);};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

const head=`<header class="hd"><div class="hd-mk">HM</div><div>
  <h1>HUBMAIS · COBRANÇA <em>— Central de Acionamentos</em></h1>
  <div class="m">Cancelados · quebras · proatividade · atualizado em ${D.gerado_em}</div></div></header>`;

/* ---------- senha ---------- */
R.innerHTML=head+`<div class="cad"><h3>ACESSO PROTEGIDO</h3>
  <p>Esta lista tem <b>nome, telefone e boleto</b> de clientes de todo o time (${D.qtd} na fila).
  Digite a senha dos acionamentos. Ela não fica gravada.</p>
  <input id="pw" type="password" placeholder="••••••••" autocomplete="off">
  <button class="btn" id="go">Abrir a fila</button><div class="msg" id="msg"></div></div>`;
const pw=document.getElementById('pw'), go=document.getElementById('go'), msg=document.getElementById('msg');
async function abrir(){
  if(!pw.value){msg.textContent='Digite a senha';msg.className='msg err';return;}
  go.disabled=pw.disabled=true; msg.textContent='Abrindo…'; msg.className='msg';
  await new Promise(r=>setTimeout(r,40));
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.lista.salt),iterations:D.lista.it,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const L=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.lista.iv)},key,b64(D.lista.ct))));
    iniciar(L);
  }catch(e){go.disabled=pw.disabled=false;pw.value='';msg.textContent='Senha incorreta';msg.className='msg err';pw.focus();}
}
go.onclick=abrir; pw.onkeydown=e=>{if(e.key==='Enter')abrir();}; pw.focus();

/* ---------- régua: o que fazer com cada cliente hoje ---------- */
const REGUA=[
  {id:'cancelado',t:'Cancelado — reativar',c:'#A78BFA',s:'O acordo já caiu. Ofereça refazer a negociação.',tpl:'reativar'},
  {id:'resgate',t:'Passou do prazo — resgate',c:'#F43F5E',s:'Prazo do 1º pagamento já passou e ainda não pagou. Prioridade máxima.',tpl:'resgate'},
  {id:'hoje',t:'Vence hoje',c:'#F43F5E',s:'Último dia para pagar sem perder o acordo.',tpl:'hoje'},
  {id:'lembrete',t:'Lembrete (1 a 2 dias)',c:'#FFB020',s:'Proatividade: lembre antes de vencer.',tpl:'lembrete'},
  {id:'acompanhar',t:'Acompanhar (3 dias ou mais)',c:'#22D3EE',s:'Ainda há prazo. Acione se sobrar tempo.',tpl:'lembrete'},
  {id:'semdata',t:'Sem data limite',c:'#7C8FA6',s:'A planilha não trouxe a data limite.',tpl:'lembrete'},
];
function faixa(c){
  if(c.cancelado_em) return 'cancelado';
  const d=dias(c.limite);
  if(d===null) return 'semdata';
  if(d<0) return 'resgate'; if(d===0) return 'hoje'; if(d<=2) return 'lembrete'; return 'acompanhar';
}
const TPL_PADRAO={
  lembrete:'Olá, {nome}! Tudo bem? Aqui é da central de cobrança. Passando para lembrar que o pagamento do seu acordo de {valor} vence em {vencimento}. Para facilitar, segue a linha digitável:\n{linha}\nQualquer dúvida, é só responder aqui.',
  hoje:'Olá, {nome}! Aqui é da central de cobrança. O pagamento do seu acordo de {valor} vence HOJE ({vencimento}). Pagando hoje você mantém as condições negociadas. Linha digitável:\n{linha}\nPosso ajudar em algo?',
  resgate:'Olá, {nome}! Aqui é da central de cobrança. Não identificamos o pagamento do seu acordo de {valor}, que venceu em {vencimento}. Ainda dá para resolver e evitar o cancelamento. Podemos conversar agora?',
  reativar:'Olá, {nome}! Aqui é da central de cobrança. Seu acordo de {valor} foi cancelado por falta de pagamento, mas ainda conseguimos negociar uma nova condição para você. Podemos conversar?',
};
let TPL=Object.assign({},TPL_PADRAO,store.get('acion_tpl',{}));
function textoMsg(c){
  const t=TPL[(REGUA.find(r=>r.id===faixa(c))||REGUA[3]).tpl]||'';
  const primeiro=(c.cliente||'').split(' ')[0]; const nome=primeiro?primeiro[0]+primeiro.slice(1).toLowerCase():'';
  return t.replace(/{nome}/g,nome).replace(/{valor}/g,brl(c.valor)).replace(/{vencimento}/g,c.limite||'—')
          .replace(/{linha}/g,c.linha||'(peça a linha digitável no sistema)');
}

/* ---------- status (fica salvo neste navegador) ---------- */
const STATUS=[['contatado','Falei','#34D399'],['sem_resposta','Sem resposta','#7C8FA6'],['promessa','Prometeu pagar','#FFB020'],
              ['pagou','Pagou','#22D3EE'],['nao_acionar','Não acionar','#A78BFA']];
let LOG=store.get('acion_log',{});  // {SAN:[{d:'2026-10-13',h:'14:02',st:'promessa',obs:''}]}
const hojeDe=san=>(LOG[san]||[]).filter(x=>x.d===hojeISO()).slice(-1)[0];
function marcar(san,st){
  const h=new Date().toTimeString().slice(0,5), L=LOG[san]=LOG[san]||[];
  const at=L.find(x=>x.d===hojeISO());
  if(at&&at.st===st){L.splice(L.indexOf(at),1);} else if(at){at.st=st;at.h=h;} else L.push({d:hojeISO(),h,st,obs:''});
  store.set('acion_log',LOG); render();
}
function obs(san,txt){const at=hojeDe(san); if(at){at.obs=txt;store.set('acion_log',LOG);}}

/* ---------- tela ---------- */
let LISTA=[], filtro='todos', busca='';
function iniciar(L){LISTA=L.map(c=>Object.assign(c,{_id:c.san||c.cliente}));render();}

function kpis(){
  const f=c=>faixa(c), urg=LISTA.filter(c=>['resgate','hoje'].includes(f(c)));
  const feitos=LISTA.filter(c=>hojeDe(c._id)).length;
  const k=(l,v,d)=>`<div class="k"><div class="l">${l}</div><div class="v n">${v}</div><div class="d">${d||''}</div></div>`;
  return `<div class="kpis">
    ${k('Na fila',LISTA.length,D.pagos?D.pagos+' já efetivados fora da lista':'')}
    ${k('Urgentes hoje',urg.length,'vence hoje ou passou do prazo')}
    ${k('Valor em risco (urgentes)',brl0(urg.reduce((a,c)=>a+(c.valor||0),0)))}
    ${k('Acionados hoje',feitos,LISTA.length?Math.round(feitos/LISTA.length*100)+'% da fila':'')}
    ${k('Promessas hoje',LISTA.filter(c=>(hojeDe(c._id)||{}).st==='promessa').length,'')}
  </div>`;
}
function cartao(c){
  const fx=REGUA.find(r=>r.id===faixa(c)), d=dias(c.limite), at=hojeDe(c._id), msgTxt=encodeURIComponent(textoMsg(c));
  const ult=(LOG[c._id]||[]).filter(x=>x.d!==hojeISO()).slice(-1)[0];
  const sel=d===null?['—','cz']:c.cancelado_em?['cancelado em '+c.cancelado_em.slice(0,5),'venc']:d<0?['venceu há '+(-d)+'d','hoje']:d===0?['vence hoje','hoje']:d<=2?['em '+d+'d','prox']:['em '+d+'d','ok'];
  const fones=(c.telefones||[]).length?(c.telefones||[]).map(f=>`<div class="fone"><span class="nb n">${f.exibir}</span>
      <a class="wa" href="https://wa.me/${f.link}?text=${msgTxt}" target="_blank" rel="noopener">WhatsApp</a>
      <a class="tel" href="tel:+${f.link}">Ligar</a></div>`).join(''):'<span class="sub">sem telefone na planilha</span>';
  return `<div class="cli ${at?'feito':''}" style="--c:${fx.c}">
    <div><div class="nm">${esc(c.cliente||'—')}</div>
      <div class="sub">${esc(c.san||'')} · <b>${c.tipo==='quebra'?'QUEBRA':'CANCELAMENTO'}</b> · negociado por <b>${esc(c.operador||'—')}</b>${c.negociado_em?' em '+c.negociado_em.slice(0,5):''}</div>
      <div class="vl n">${brl(c.valor)}</div>
      <span class="tag ${sel[1]}">${sel[0]}</span>${c.limite?`<span class="tag cz">limite ${c.limite.slice(0,5)}</span>`:''}
      ${c.parcelas?`<span class="tag cz">${c.parcelas}x</span>`:''}${c.desconto!=null?`<span class="tag cz">${Math.round(c.desconto*100)}% desc.</span>`:''}
      ${c.motivo?`<div class="mot">Motivo informado${c.motivo_em?' em '+c.motivo_em:''}: <b>${esc(c.motivo)}</b></div>`:''}</div>
    <div><div class="fones">${fones}</div>
      ${c.linha?`<button class="cp" data-cp="${esc(c.linha)}">Copiar linha digitável</button>`:''}</div>
    <div class="st">${STATUS.map(([k,l,cor])=>`<button data-san="${esc(c._id)}" data-st="${k}" class="${at&&at.st===k?'on':''}" style="${at&&at.st===k?'background:'+cor:''}">${l}</button>`).join('')}
      ${at?`<input data-obs="${esc(c._id)}" placeholder="observação (opcional)" value="${esc(at.obs||'')}">`:''}
      ${ult?`<div class="hist">último contato: ${ult.d.slice(8,10)}/${ult.d.slice(5,7)} · ${(STATUS.find(s=>s[0]===ult.st)||['',''])[1]}${ult.obs?' · '+esc(ult.obs):''}</div>`:''}</div>
  </div>`;
}
function render(){
  const q=busca.trim().toLowerCase();
  let L=LISTA.filter(c=>!q||(c.cliente||'').toLowerCase().includes(q)||(c.san||'').toLowerCase().includes(q)||(c.operador||'').toLowerCase().includes(q));
  const cont=id=>L.filter(c=>faixa(c)===id).length, pend=L.filter(c=>!hojeDe(c._id)).length;
  if(filtro==='pendentes') L=L.filter(c=>!hojeDe(c._id)); else if(filtro!=='todos') L=L.filter(c=>faixa(c)===filtro);
  const chips=[['todos','Todos',LISTA.length],['pendentes','Falta acionar',pend],...REGUA.filter(r=>cont(r.id)).map(r=>[r.id,r.t.split(' —')[0].split(' (')[0],cont(r.id)])];
  let corpo='';
  REGUA.forEach(r=>{
    const G=L.filter(c=>faixa(c)===r.id).sort((a,b)=>(!!hojeDe(a._id))-(!!hojeDe(b._id))||(b.valor||0)-(a.valor||0));
    if(!G.length) return;
    corpo+=`<div class="grp" style="--c:${r.c}"><div class="grp-h"><span class="t">${r.t} · ${G.length}</span><span class="s">${r.s}</span></div>
      ${G.map(cartao).join('')}</div>`;
  });
  R.innerHTML=head+kpis()+`<div class="bar">${chips.map(([k,l,q])=>`<button class="chipf ${filtro===k?'on':''}" data-f="${k}">${l}<b>${q}</b></button>`).join('')}
    <input class="busca" id="bs" placeholder="buscar cliente, SAN ou operador" value="${esc(busca)}">
    <button class="chipf" id="csv">Baixar relatório do dia</button></div>
    ${corpo||'<div class="pn"><div class="vazio">Nada nesta seleção</div></div>'}
    <details class="tpl"><summary>Mensagens de WhatsApp (editar)</summary><div class="pn-b">
      <p class="prose" style="font-size:12px;color:var(--dim);line-height:1.6">O botão WhatsApp de cada cliente já abre a conversa com a mensagem certa para a situação dele.
      Use <b>{nome}</b>, <b>{valor}</b>, <b>{vencimento}</b> e <b>{linha}</b> (linha digitável). As mudanças ficam salvas neste computador.</p>
      ${[['lembrete','Lembrete / acompanhar'],['hoje','Vence hoje'],['resgate','Passou do prazo — resgate'],['reativar','Cancelado — reativar']].map(([k,l])=>
        `<label>${l}</label><textarea data-tpl="${k}">${esc(TPL[k])}</textarea>`).join('')}
      <button class="chipf" id="tplreset" style="margin-top:12px">Voltar aos textos padrão</button></div></details>
    <div class="ft"><b>Como funciona:</b> a fila é montada a cada ATUALIZAR a partir de ${D.fontes.map(esc).join(' e ')}.
      O grupo de cada cliente é calculado pela <b>data de hoje</b> e pela data limite do 1º pagamento, então a página continua certa ao longo do dia.
      Acordos já efetivados saem da fila sozinhos. Os botões de status (Falei, Sem resposta…) ficam salvos <b>só neste navegador</b> —
      use sempre o mesmo computador e baixe o relatório do dia ao terminar.<br><br>
      <b>Dados de cliente:</b> use somente para o trabalho de cobrança. Não encaminhe esta tela nem o link.</div>`;
  R.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filtro=b.dataset.f;render();});
  R.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>marcar(b.dataset.san,b.dataset.st));
  R.querySelectorAll('[data-obs]').forEach(i=>i.onchange=()=>obs(i.dataset.obs,i.value));
  R.querySelectorAll('[data-cp]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.cp);b.textContent='Copiado ✓';}catch(e){prompt('Copie a linha:',b.dataset.cp);}});
  R.querySelectorAll('[data-tpl]').forEach(t=>t.onchange=()=>{TPL[t.dataset.tpl]=t.value;store.set('acion_tpl',TPL);render();});
  const rs=document.getElementById('tplreset'); if(rs) rs.onclick=()=>{TPL=Object.assign({},TPL_PADRAO);store.set('acion_tpl',{});render();};
  const bs=document.getElementById('bs'); bs.oninput=()=>{busca=bs.value;const p=bs.selectionStart;render();const n=document.getElementById('bs');n.focus();n.setSelectionRange(p,p);};
  document.getElementById('csv').onclick=baixarCSV;
}
function baixarCSV(){
  const linhas=[['Data','Hora','SAN','Cliente','Tipo','Grupo','Valor','Data limite','Operador','Status','Observação']];
  LISTA.forEach(c=>{const at=hojeDe(c._id);
    linhas.push([hojeISO(),at?at.h:'',c.san||'',c.cliente||'',c.tipo,(REGUA.find(r=>r.id===faixa(c))||{}).t||'',
      (c.valor||0).toFixed(2).replace('.',','),c.limite||'',c.operador||'',at?(STATUS.find(s=>s[0]===at.st)||['',''])[1]:'não acionado',at?at.obs||'':'']);});
  const csv='﻿'+linhas.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='acionamentos_'+hojeISO()+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}
})();
</script>
</body>
</html>
