<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seu Painel · Luzia Santos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B12;--panel:#0C121C;--panel2:#101827;--panel3:#16202F;
  --line:#1A2433;--line2:#243247;
  --amber:#FFB020;--cyan:#22D3EE;--green:#34D399;--red:#F43F5E;--violet:#A78BFA;
  --txt:#E8EFF7;--dim:#7C8FA6;--faint:#48596E;
  --mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(900px 420px at 85% -6%,rgba(255,176,32,.045),transparent 62%),
  radial-gradient(700px 380px at 5% 104%,rgba(34,211,238,.035),transparent 60%),var(--bg);
  color:var(--txt);font-family:var(--mono);font-size:13px;-webkit-font-smoothing:antialiased;min-height:100vh}
::selection{background:rgba(255,176,32,.3)}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 64px}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.n{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.prose{font-family:var(--sans);letter-spacing:0;text-transform:none}

/* header */
.hd{border-bottom:1px solid var(--line);padding:18px 0 16px;margin-bottom:20px}
.hd-t{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hd-mk{width:38px;height:38px;flex:none;border:1px solid var(--amber);color:var(--amber);
  background:rgba(255,176,32,.07);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.hd-i h1{font-size:16px;font-weight:700;letter-spacing:.03em}
.hd-i h1 em{font-style:normal;color:var(--amber)}
.hd-m{display:flex;gap:9px;align-items:center;margin-top:5px;flex-wrap:wrap}
.hd-m span{font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}

/* perfil */
.pf{border:1px solid var(--line);background:var(--panel);border-top:2px solid var(--acc);
  padding:22px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.pf-av{width:60px;height:60px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;background:var(--accbg);color:var(--acc);border:1px solid var(--accbd)}
.pf-i h2{font-size:21px;font-weight:700;letter-spacing:.02em}
.pf-i .m{display:flex;gap:9px;align-items:center;margin-top:7px;flex-wrap:wrap;
  font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.pf-s{margin-left:auto;text-align:right}
.pf-s .v{font-size:42px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--acc)}
.pf-s .l{font-size:9px;letter-spacing:.15em;margin-top:6px;color:var(--acc);font-weight:700}
.pf-s .c{font-size:8.5px;letter-spacing:.1em;color:var(--faint);margin-top:4px}

.tag{font-size:8.5px;font-weight:700;letter-spacing:.1em;padding:2px 7px;text-transform:uppercase}
.tag.m{color:var(--cyan);background:rgba(34,211,238,.1)}
.tag.t{color:var(--amber);background:rgba(255,176,32,.1)}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);background:var(--line);gap:1px;margin-top:16px}
.k{background:var(--panel);padding:14px 15px 12px;position:relative;overflow:hidden;min-height:98px}
.k .l{font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
.k .v{font-size:21px;font-weight:700;margin-top:9px;line-height:1;letter-spacing:-.025em}
.k .d{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;margin-top:8px;font-weight:700}
.k .d.up{color:var(--green)}.k .d.dn{color:var(--red)}.k .d.eq{color:var(--dim)}
.k .sp{position:absolute;left:0;right:0;bottom:0;opacity:.85;pointer-events:none}

/* painel */
.pn{border:1px solid var(--line);background:var(--panel);margin-top:16px}
.pn-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pn-h h3{font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.pn-h .nt{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.pn-b{padding:18px 16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g21{display:grid;grid-template-columns:1.7fr 1fr;gap:16px}

/* destaque */
.hi{border:1px solid var(--accbd);background:linear-gradient(100deg,var(--accbg),transparent 62%);
  padding:18px 20px;display:flex;gap:16px;align-items:flex-start;margin-top:16px}
.hi .ic{font-size:9px;font-weight:700;letter-spacing:.16em;color:var(--acc);white-space:nowrap;padding-top:3px;width:76px;flex:none}
.hi h4{font-size:13px;font-weight:700;letter-spacing:.03em;margin-bottom:7px}
.hi p{font-family:var(--sans);font-size:13px;line-height:1.65;color:var(--dim)}
.hi p b{color:var(--txt);font-weight:600}
.hi p .hl{font-family:var(--mono);color:var(--acc);font-weight:700}

/* 10 clientes */
.dez{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.dez i{width:30px;height:38px;display:flex;align-items:center;justify-content:center;
  font-size:15px;border:1px solid var(--line2)}
.dez i.on{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.45);color:var(--green)}
.dez i.off{background:var(--panel3);color:var(--faint)}

/* barras */
.bar{display:flex;align-items:center;gap:11px;padding:6px 0}
.bar .l{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);width:104px;flex:none}
.bar .t{flex:1;height:9px;background:var(--panel3)}
.bar .t i{display:block;height:100%;animation:gw .8s cubic-bezier(.2,.8,.3,1) both;transform-origin:left}
.bar .v{font-size:11.5px;font-weight:700;width:44px;text-align:right}
.bar .w{font-size:9px;color:var(--faint);width:30px;text-align:right}
@keyframes gw{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* simulador */
.sim-r{display:flex;align-items:center;gap:14px;margin:6px 0 16px;flex-wrap:wrap}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:200px;height:5px;background:var(--panel3);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;background:var(--amber);cursor:pointer;border:2px solid #070B12}
input[type=range]::-moz-range-thumb{width:19px;height:19px;background:var(--amber);cursor:pointer;border:2px solid #070B12}
.sim-v{font-size:20px;font-weight:800;color:var(--amber);width:78px;text-align:right}
.sim-out{border:1px solid var(--line2);background:var(--panel2);padding:16px 18px;text-align:center}
.sim-out .big{font-size:31px;font-weight:800;color:var(--green);letter-spacing:-.02em;line-height:1.1}
.sim-out .sub{font-family:var(--sans);font-size:12px;color:var(--dim);margin-top:8px;line-height:1.55}
.sim-out.zero .big{color:var(--dim)}

/* diagnostico */
.dg{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1px solid var(--line);
  background:var(--panel2);margin-bottom:9px;border-left:2px solid var(--c)}
.dg .i{font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--c);width:60px;flex:none;padding-top:2px}
.dg p{font-family:var(--sans);font-size:12.5px;line-height:1.6;color:var(--dim)}
.dg p b{color:var(--txt);font-weight:600}

/* proximo passo */
.np{border:1px solid rgba(255,176,32,.35);background:linear-gradient(100deg,rgba(255,176,32,.1),transparent 60%);
  padding:22px 24px;margin-top:16px}
.np .t{font-size:9px;font-weight:700;letter-spacing:.17em;color:var(--amber);margin-bottom:10px}
.np h3{font-size:16px;font-weight:700;letter-spacing:.02em;margin-bottom:9px}
.np p{font-family:var(--sans);font-size:13px;line-height:1.65;color:var(--dim)}
.np p b{color:var(--txt);font-weight:600}

.ft{margin-top:26px;padding:15px 18px;border:1px dashed var(--line2);
  font-family:var(--sans);font-size:11px;line-height:1.7;color:var(--faint)}

/* ---- abas ---- */
.abas{display:flex;gap:0;border-bottom:1px solid var(--line);margin:20px 0 0;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas button{flex:none;white-space:nowrap}
.abas button{padding:11px 18px;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--faint);background:none;border:none;
  border-bottom:2px solid transparent;cursor:pointer;transition:.15s}
.abas button:hover{color:var(--dim)}
.abas button.on{color:var(--amber);border-bottom-color:var(--amber)}
.abas .cnt{margin-left:7px;background:var(--amber);color:#0A0703;font-size:8.5px;padding:1px 5px;font-weight:800}
.vista{display:none}.vista.on{display:block;animation:rise .25s ease both}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---- cadeado dos acordos ---- */
.cad{border:1px solid var(--line);background:var(--panel);border-top:2px solid var(--amber);
  padding:30px;max-width:430px;margin:20px auto;text-align:center}
.cad h3{font-size:12px;font-weight:700;letter-spacing:.05em;margin-bottom:8px}
.cad p{font-family:var(--sans);font-size:12px;line-height:1.6;color:var(--dim);margin-bottom:18px}
.cad input{width:100%;background:#070B12;border:1px solid var(--line2);color:var(--txt);
  font-family:var(--mono);font-size:14px;letter-spacing:.2em;padding:12px;text-align:center}
.cad input:focus{outline:none;border-color:var(--amber)}
.cad button{width:100%;margin-top:12px;background:var(--amber);color:#0A0703;padding:12px;
  border:none;font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;cursor:pointer}
.cad .msg{min-height:15px;margin-top:11px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.cad .msg.err{color:var(--red)}

/* ---- tabela de acordos ---- */
.acd{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
.acd th{font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
  text-align:right;padding:0 9px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.acd th:first-child,.acd th.l{text-align:left}
.acd td{padding:9px;border-bottom:1px solid rgba(26,36,51,.6);text-align:right;white-space:nowrap}
.acd td:first-child,.acd td.l{text-align:left}
.acd tbody tr:hover td{background:rgba(255,176,32,.04)}
.urg{font-size:8.5px;font-weight:700;letter-spacing:.08em;padding:2px 7px;text-transform:uppercase}
.urg.hoje{background:rgba(244,63,94,.14);color:var(--red)}
.urg.venc{background:rgba(167,139,250,.14);color:var(--violet)}
.urg.prox{background:rgba(255,176,32,.13);color:var(--amber)}
.urg.ok{background:rgba(52,211,153,.13);color:var(--green)}

/* ---- contatos ---- */
.fones{display:flex;flex-direction:column;gap:5px}
.fone{display:flex;align-items:center;gap:5px}
.fone .nb{font-size:11px;color:var(--txt);min-width:104px}
.fone a{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;
  border:1px solid var(--line2);text-decoration:none;font-size:11px;transition:.15s}
.fone a.wa{color:#25D366}
.fone a.wa:hover{background:rgba(37,211,102,.14);border-color:#25D366}
.fone a.tel{color:var(--cyan)}
.fone a.tel:hover{background:rgba(34,211,238,.14);border-color:var(--cyan)}


/* ---- detalhamento diario ---- */
.dias{display:flex;flex-direction:column;gap:0}
.dia-row{display:grid;grid-template-columns:128px 1fr 100px 62px;gap:12px;align-items:center;
  padding:10px 0;border-bottom:1px solid rgba(26,36,51,.6)}
.dia-row:last-child{border-bottom:none}
.dia-row.media{border-top:1px solid var(--line2);margin-top:4px;padding-top:14px;border-bottom:none}
.dia-data{font-size:11px;color:var(--dim)}
.dia-data b{color:var(--txt);font-weight:600}
.dia-t{height:9px;background:var(--panel3);position:relative}
.dia-t i{display:block;height:100%;animation:gw .7s cubic-bezier(.2,.8,.3,1) both}
.dia-v{font-size:13px;font-weight:700;text-align:right}
.dia-d{font-size:10px;font-weight:700;text-align:right}
.dia-d.up{color:var(--green)}.dia-d.dn{color:var(--red)}.dia-d.eq{color:var(--faint)}

/* ---- qualidade (PSAT + monitoria) ---- */
.qk .k{min-height:92px}
.nt5{display:flex;flex-direction:column;gap:2px}
.nt5-r{display:grid;grid-template-columns:62px 1fr 74px;gap:12px;align-items:center;padding:6px 0}
.nt5-r .l{font-size:10px;letter-spacing:.1em;color:var(--dim);font-weight:700}
.nt5-r .t{height:12px;background:var(--panel3);position:relative}
.nt5-r .t i{display:block;height:100%;animation:gw .7s cubic-bezier(.2,.8,.3,1) both;transform-origin:left}
.nt5-r .t b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--txt);opacity:.55}
.nt5-r .v{font-size:11px;font-weight:700;text-align:right}
.nt5-r .v span{color:var(--faint);font-weight:500}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 6px;
  font-size:11px;font-weight:800;border:1px solid}
.chip.c5,.chip.c4{color:var(--green);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1)}
.chip.c3{color:var(--amber);border-color:rgba(255,176,32,.4);background:rgba(255,176,32,.1)}
.chip.c2,.chip.c1{color:var(--red);border-color:rgba(244,63,94,.45);background:rgba(244,63,94,.12)}
.chip.cx{color:var(--faint);border-color:var(--line2);font-weight:600;font-size:9.5px;letter-spacing:.06em}
.acd tr.det td{background:rgba(244,63,94,.05)}
.mon{border:1px solid var(--line);background:var(--panel2);border-left:2px solid var(--c);padding:16px 18px;margin-bottom:12px}
.mon-h{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.mon-h .nota{font-size:34px;font-weight:800;line-height:1;color:var(--c);letter-spacing:-.03em}
.mon-h .nota small{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:0}
.mon-h .q{font-size:9px;letter-spacing:.14em;color:var(--c);font-weight:700;margin-top:6px}
.mon-h .meta{margin-left:auto;text-align:right;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);line-height:1.8}
.mon-h .meta b{color:var(--txt);font-weight:700}
.mon h5{font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin:16px 0 8px}
.mon ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.mon li{font-family:var(--sans);font-size:12.5px;line-height:1.55;color:var(--dim);padding-left:16px;position:relative}
.mon li:before{content:'▸';position:absolute;left:0;color:var(--amber);font-family:var(--mono)}
.mon li.gr:before{color:var(--red)}
.mon li b{color:var(--txt);font-weight:600}
.mon .rel{margin-top:14px;border-top:1px dashed var(--line2);padding-top:12px}
.mon .rel button{background:none;border:1px solid var(--line2);color:var(--dim);font-family:var(--mono);font-size:9.5px;
  font-weight:700;letter-spacing:.13em;text-transform:uppercase;padding:7px 12px;cursor:pointer}
.mon .rel button:hover{border-color:var(--amber);color:var(--amber)}
.mon .rel p{font-family:var(--sans);font-size:12.5px;line-height:1.65;color:var(--dim);margin-top:4px}
.evo{display:flex;align-items:flex-end;gap:6px;height:74px;margin:6px 0 4px}
.evo div{flex:1;max-width:38px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.evo i{display:block;width:100%;animation:gw2 .6s ease both;transform-origin:bottom}
.evo span{font-size:8.5px;color:var(--faint);letter-spacing:.04em}
.evo em{font-style:normal;font-size:9.5px;font-weight:700}
@keyframes gw2{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.vazio{padding:26px 18px;text-align:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.vazio p{font-family:var(--sans);text-transform:none;letter-spacing:0;font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6}
.cad.mini{max-width:none;margin:0 0 16px;padding:18px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;text-align:left}
.cad.mini p{margin:0;flex:1;min-width:200px}
.cad.mini input{width:180px;padding:9px;font-size:12px}
.cad.mini button{width:auto;margin:0;padding:10px 16px}
.cad.mini .msg{width:100%;margin-top:0}
.rc{padding:9px 0;border-bottom:1px solid rgba(26,36,51,.6)}
.rc:last-child{border-bottom:none}
.rc-t{display:flex;gap:8px;align-items:center}
.rc-g{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.rc-i{font-family:var(--sans);font-size:12.5px;line-height:1.5;color:var(--txt);margin:4px 0 6px}
.rc-b{display:flex;align-items:center;gap:8px}
.rc-b i{display:block;height:5px;animation:gw .7s cubic-bezier(.2,.8,.3,1) both;transform-origin:left}
.rc-b span{font-size:10px;font-weight:700;color:var(--dim)}
.fg{margin-top:14px;border:1px solid rgba(244,63,94,.45);background:rgba(244,63,94,.08);padding:11px 13px;
  font-family:var(--sans);font-size:12.5px;line-height:1.6;color:var(--txt)}
.fg b{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--red);display:block;margin-bottom:4px}
.fb{font-family:var(--sans);font-size:12.5px;line-height:1.65;color:var(--dim);white-space:pre-line;
  border-left:2px solid var(--line2);padding:2px 0 2px 12px}
.mon-f{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media(max-width:900px){.qk{grid-template-columns:repeat(2,1fr)!important}}

/* ---- exceções ---- */
.exf{display:grid;grid-template-columns:150px 190px 1fr 1fr 170px;gap:10px;align-items:end}
.exf label{display:block;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.exf input,.exf select,.exo input{width:100%;background:#070B12;border:1px solid var(--line2);color:var(--txt);
  font-family:var(--sans);font-size:12.5px;padding:9px 10px}
.exf input:focus,.exf select:focus,.exo input:focus{outline:none;border-color:var(--amber)}
.exf input.err,.exf select.err{border-color:var(--red)}
.exo{display:flex;gap:10px;align-items:end;margin-top:10px}
.exo>div{flex:1}
.exo label{display:block;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.bt{background:var(--amber);color:#0A0703;border:none;font-family:var(--mono);font-size:10px;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase;padding:11px 16px;cursor:pointer;white-space:nowrap}
.bt.sec{background:none;border:1px solid var(--line2);color:var(--dim)}
.bt:disabled{opacity:.45;cursor:default}
.exmsg{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-top:10px;min-height:14px;color:var(--faint)}
.exmsg.ok{color:var(--green)}.exmsg.err{color:var(--red)}
.acd td .rm{background:none;border:none;color:var(--faint);cursor:pointer;font-size:14px}
.acd td .rm:hover{color:var(--red)}
.dv{font-size:8.5px;font-weight:700;letter-spacing:.08em;padding:2px 7px;text-transform:uppercase}
.dv.a{background:rgba(52,211,153,.13);color:var(--green)}.dv.n{background:rgba(244,63,94,.14);color:var(--red)}.dv.g{background:rgba(255,176,32,.13);color:var(--amber)}
@media(max-width:900px){.exf{grid-template-columns:1fr 1fr}.exo{flex-wrap:wrap}}

plicativo, whatsapp e etc)"}],"falhas_graves":[],"aderencia":0.9722,"itens_avaliados":36,"feedback":"Resumo da Monitoria\n\nA atendente iniciou o contato de forma cordial e realizou a validação cadastral da titular, confirmando nome, data de nascimento, CPF e telefone para retorno em caso de queda da ligação. A cliente relatou estar sem internet há aproximadamente três semanas e solicitou a cobrança proporcional aos dias de utilização. A atendente explicou que a fatura ainda não havia sido gerada e orientou que o desconto poderia ser verificado na próxima fatura, referente ao mês 11. O atendimento foi encerrado cordialmente, com a cliente satisfeita com as informações e orientada a retornar após a emissão da fatura. Também houve confirmação do e-mail cadastrado e convite para avaliação do atendimento.\n\nPontos de melhoria: A atendente iniciou as explicações sobre contestação antes de concluir a validação cadastral. Não seguiu o procedimento padrão de confirmação.  apresentar os canais de autoatendimento disponíveis.\n\nOrientação: Reforçar o cumprimento da sequência correta do atendimento, priorizando a validação cadastral antes de fornecer informações sobre o contrato. Aprimorar as orientações sobre procedimentos de  canais digitais e as alternativas disponíveis, mantendo a clareza, a segurança e a objetividade durante a ligação.","prazo_feedback":null,"htb":"HTB…3339","pontos":[],"tem_relato":false},{"id":"905","data":"30/09/2026","criado_em":"24/10/2026","nota":88.0,"nota_bruta":88.0,"falha_grave":false,"monitor":"Paula Fernanda Alves","tipo":"Supervisor · Não venda","status":"Finalizada","ciencia":null,"itens":[{"grupo":"Cadastro","item":"No caso de contato e negociação com terceiros,realizou a confirmação de dados de acordo com a Base de Conhecimento"},{"grupo":"Oportunidade de negócio","item":"Informou sobre as facilidades do serviço (área do assinante, aplicativo, whatsapp e etc)"}],"falhas_graves":[],"aderencia":0.96,"itens_avaliados":50,"feedback":"O atendente manteve a cordialidade durante o contato e realizou a coleta dos dados do titular para consulta cadastral. A cliente informou que o contrato está em nome do ex-marido e buscou orientações sobre transferência de titularidade, novo contrato e possíveis descontos relacionados ao filho. O atendente reenviou a fatura via WhatsApp, orientou sobre o pagamento das pendências e explicou os procedimentos e prazos para alteração de titularidade, incluindo o envio de documentos em até 15 dias. Também informou a multa de cancelamento de R$ 526,03 e os 173 dias restantes de fidelidade. Esclareceu que não há desconto especial para pessoas com deficiência, porém prolongou a ligação ao informar repetidamente que iria verificar essa questão. A cliente decidiu quitar a pendência e aguardar o término da fidelidade para avaliar um novo contrato.\n\n*Pontos de melhoria:* O atendimento apresentou pausas excessivas antes da confirmação dos dados, linguagem repetitiva e explicações pouco claras, aumentando o tempo da ligação. O atendente não apresentou os canais digitais e as facilidades do serviço, como aplicativo e área do assinante, nem realizou sondagem sobre a causa da inadimplência. Também faltou confirmar se a ex-esposa estava autorizada a tratar de informações financeiras do titular, respeitando os procedimentos de segurança e sigilo.\n\n*Orientação:* Trabalhar a objetividade e a clareza na comunicação, reduzir pausas desnecessárias e fornecer respostas assertivas, evitando verificações prolongadas quando a informação já estiver disponível. Reforçar o conhecimento dos procedimentos de titularidade, dos benefícios e dos canais digitais, além de realizar a sondagem adequada e observar rigorosamente as regras de proteção de dados durante o atendimento.","prazo_feedback":null,"htb":"HTB…3866","pontos":[],"tem_relato":false},{"id":"893","data":"21/10/2026","criado_em":"23/10/2026","nota":93.0,"nota_bruta":93.0,"falha_grave":false,"monitor":"Paula Fernanda Alves","tipo":"Supervisor · Não venda","status":"Finalizada","ciencia":null,"itens":[{"grupo":"Oportunidade de negócio","item":"Informou sobre as facilidades do serviço (área do assinante, aplicativo, whatsapp e etc)"}],"falhas_graves":[],"aderencia":0.98,"itens_avaliados":50,"feedback":"Resumo do atendimento\n\nA cliente Cláudia, esposa e representante do titular Fábio, entrou em contato com o objetivo de renegociar faturas antigas. A atendente solicitou os dados cadastrais do titular, incluindo nome completo, data de nascimento e CPF, além de confirmar o e-mail e o telefone para contato.\nA cliente aceitou a proposta apresentada e confirmou o recebimento do documento. Ao final da ligação, foi solicitada uma avaliação do atendimento, ocasião em que Cláudia elogiou a atuação da atendente, demonstrando satisfação com a condução e a solução oferecida.\nDe modo geral, o atendimento foi conduzido de forma satisfatória, com uma negociação efetiva, informações claras sobre valores e condições e envio ágil dos documentos. Como oportunidade de melhoria, destaca-se a necessidade de tornar a apresentação inicial mais clara, mencionando inequivocamente o nome da empresa, realizar a validação dos três dígitos do CPF conforme o procedimento estabelecido e apresentar os canais digitais disponíveis.\n\nPontos fortes\n\n•\tNegociação efetiva: apresentou uma proposta com desconto, informando claramente o valor original e o valor final para pagamento.\n•\tAgilidade no atendimento: enviou prontamente o demonstrativo por e-mail e WhatsApp.\n•\tClareza nas orientações: explicou os procedimentos de baixa do pagamento via Pix e o prazo para retirada da negativação.\n•\tConfirmação das informações: informou o protocolo e confirmou o recebimento do documento pela cliente.\n•\tSatisfação da cliente: ao final da ligação, Cláudia elogiou o atendimento prestado pela atendente.\nPontos de melhoria\n•\tCanais digitais: apresentar os canais digitais disponíveis para facilitar consultas, pagamentos e acompanhamento de solicitações.\n\nConclusão da monitoria\n\nA atendente demonstrou cordialidade, agilidade e domínio na apresentação da proposta de negociação, contribuindo para uma experiência positiva e para a aceitação da condição oferecida. O elogio espontâneo da cliente ao final da ligação reforça a percepção positiva sobre a condução do atendimento.\nAs oportunidades de melhoria estão concentradas no cumprimento integral do roteiro de abertura, na validação cadastral e na divulgação dos canais digitais. Recomenda-se reforçar esses procedimentos em feedback, visando manter a qualidade da negociação e elevar a conformidade operacional nas próximas monitorias.","prazo_feedback":null,"htb":"HTB…4008","pontos":[],"tem_relato":false},{"id":"848","data":"16/10/2026","criado_em":"21/10/2026","nota":85.0,"nota_bruta":85.0,"falha_grave":false,"monitor":"Paula Fernanda Alves","tipo":"Supervisor · Não venda","status":"Finalizada","ciencia":null,"itens":[{"grupo":"Oportunidade de negócio","item":"Informou sobre as facilidades do serviço (área do assinante, aplicativo, whatsapp e etc)"},{"grupo":"Registro","item":"Descreveu o contato de forma correta/completa"},{"grupo":"Registro","item":"Reclassificou o registro conforme Base de Conhecimento"},{"grupo":"Registro","item":"Classificou o contato de forma correta - Salesforce"},{"grupo":"Registro","item":"Classificou o contato de forma correta - Retaguarda -> Cobrança"},{"grupo":"Registro","item":"Atendente registrou o motivo de inadimplência no retaguarda?"}],"falhas_graves":[],"aderencia":0.8605,"itens_avaliados":43,"feedback":"Resumo dos pontos principais\n\n• Cliente reclama de cobrança por não devolução do equipamento após técnico ter retirado o aparelho. • Atendente verificou no sistema que não consta assinatura de retirada do equipamento. • Atendente coletou dados cadastrais (CPF, nome, data de nascimento) e gerou protocolo da ligação. • Atendente registrou o contato do técnico fornecido pela cliente e informou que encaminhará a ocorrência para a área responsável para investigação.\n\nPontos fortes\n\nColeta correta de dados cadastrais para validação (CPF, nome, data de nascimento). Empatia e pedido de desculpas pelo constrangimento causado à cliente. Encaminhamento do caso para área responsável e registro do contato do técnico para investigação.\n\nPontos fracos\n\nNão solicitou/confirmou e-mail e não detalhou como será feito o retorno (DDD e prazos). Não houve coleta imediata das provas que a cliente mencionou (prints/áudio) nem instrução clara para envio.\n\nObservações A colaboradora atendeu à ligação dentro do prazo de 5 segundos, realizando sua apresentação pessoal e informando o nome da empresa. Demonstrou empatia ao se desculpar com a cliente pelo constrangimento causado, evidenciando atenção à situação relatada. Durante o atendimento, utilizou o recurso de mute,, o que ocasionou um período prolongado de espera. Além disso, interrompeu a fala da cliente, não permitindo que ela concluísse sua explicação. Em contrapartida, realizou uma sondagem adequada e conduziu as orientações de maneira clara e objetiva, facilitando a compreensão das informações apresentadas. Ao finalizar, informou sobre a avaliação do PSAT, porém não se colocou à disposição para esclarecer possíveis dúvidas da cliente. Como oportunidade de melhoria, recomenda-se aprimorar o uso do recurso de mute, evitar interrupções durante a fala da cliente e, ao final do atendimento, perguntar se há dúvidas e oferecer suporte adicional, contribuindo para uma experiência mais acolhedora e satisfatória.","prazo_feedback":null,"htb":null,"pontos":[],"tem_relato":false},{"id":"847","data":"13/10/2026","criado_em":"21/10/2026","nota":0.0,"nota_bruta":88.0,"falha_grave":true,"monitor":"Paula Fernanda Alves","tipo":"Supervisor · Não venda","status":"Finalizada","ciencia":null,"itens":[{"grupo":"Cadastro","item":"No caso de contato e negociação com terceiros,realizou a confirmação de dados de acordo com a Base de Conhecimento"},{"grupo":"Comunicação","item":"Deixou de responder a mensagem cumprindo as regras gramaticais, de ortografia, pontuação e acentuação (whatsapp)"},{"grupo":"Oportunidade de negócio","item":"Informou sobre as facilidades do serviço (área do assinante, aplicativo, whatsapp e etc)"}],"falhas_graves":[{"grupo":"Falha grave","item":"Registrou negociação não autorizada pelo cliente"}],"aderencia":0.9412,"itens_avaliados":51,"feedback":"Resumo dos pontos principais\n\n• Cliente (esposa) relata que a dívida é do marido e solicita parcelamento. • Atendente valida CPF, nome completo e data de nascimento do titular. • Atendente apresenta opções de pagamento e valores com desconto e parcelamento. • Atendente orienta preferência por PIX explicando tempo de baixa e liberação no Serasa. • Envio de boleto/negociação para WhatsApp e orientação para confirmar nome/valor.\n\nPontos fortes\nApresentou opções de pagamento (à vista e parcelado) com valores e datas.\nExplicou vantagem do PIX e prazos de baixa de forma didática.\nConfirmou telefone/WhatsApp e enviou boleto para confirmação imediata.\n\nPontos fracos\nInformou sobre as facilidades do serviço (área do assinante, aplicativo, whatsapp e etc)\nNegociou e informou valores a terceira pessoa sem autorização do titular (violação de sigilo).\nNão confirmou corretamente o e-mail cadastrado e houve confusão sobre o titular do e-mail.\nNão seguiu totalmente procedimento de validação (não pediu explicitamente os 3 dígitos do CPF).\nObservações \nA colaboradora não realizou a abertura do atendimento dentro do prazo de 5 segundos. Entretanto, utilizou uma abordagem adequada, explicou à cliente a situação de forma clara e objetiva e demonstrou empatia ao apresentar opções de pagamento, informando os respectivos valores e datas. Orientou a cliente sobre as vantagens de realizar o pagamento via PIX e os prazos para a baixa do pagamento, transmitindo as informações de maneira didática e compreensível. Utilizou corretamente o recurso de mute durante o atendimento e, ao retornar, agradeceu à cliente pela espera, demonstrando cordialidade e empatia. Sua postura contribuiu para o fortalecimento do vínculo e para a construção de uma conexão positiva com a cliente. Por fim, informou sobre a avaliação do PSAT e colocou-se à disposição para esclarecer eventuais dúvidas, demonstrando atenção e comprometimento com a qualidade do atendimento.","prazo_feedback":null,"htb":"HTB…7048","pontos":[],"tem_relato":false},{"id":"770","data":"16/10/2026","criado_em":"19/10/2026","nota":81.0,"nota_bruta":81.0,"falha_grave":false,"monitor":"Paula Fernanda Alves","tipo":"Supervisor · Não venda","status":"Finalizada","ciencia":null,"itens":[{"grupo":"Apresentação","item":"Atendeu em até 5 segundos (ativo e receptivo)"},{"grupo":"Oportunidade de negócio","item":"Orientou cliente de forma consultiva a realizar a atualização de MOP"},{"grupo":"Oportunidade de negócio","item":"Orientou cliente de forma consultiva a realizar a atualização da data de vencimento"},{"grupo":"Oportunidade de negócio","item":"Informou sobre as facilidades do serviço (área do assinante, aplicativo, whatsapp e etc)"},{"grupo":"Registro","item":"Classificou o contato de forma correta - Salesforce"}],"falhas_graves":[],"aderencia":0.8913,"itens_avaliados":46,"feedback":"Luzia          ••• \n\n\nPONTOS POSITIVOS\n\nConfirmação de dados essenciais (nome e nascimento).\nVerificação e explicação sobre baixa do pagamento.\nVerificou ausência de fidelidade antes de orientar cancelamento.\nInformou sobre upgrade de plano\n\nPontos a desenvolver:\nNão comunicou política de tentativas de retorno em caso do call-back\nNão informou os canais digitais\nNão realizou a abertura do atendimento dentro do prazo de 5 segundos.","prazo_feedback":null,"htb":"HTB…5085","pontos":[],"tem_relato":false},{"id":"697","data":"14/10/2026","criado_em":"16/10/2026","nota":92.0,"nota_bruta":92.0,"falha_grave":false,"monitor":"Paula Fernanda Alves","tipo":"Supervisor · Não venda","status":"Finalizada","ciencia":null,"itens":[{"grupo":"Registro","item":"Classificou o contato de forma correta - Salesforce"}],"falhas_graves":[],"aderencia":0.9792,"itens_avaliados":48,"feedback":"Avaliação do atendimento\n\nPontos fortes\n\n    Realizou a validação dos dados cadastrais do cliente, confirmando nome, data de nascimento, CPF, e-mail e telefone ativos.\n\n    Enviou o e-mail com orientações passo a passo para a atualização do cartão e realizou o reenvio após identificar um erro no sistema.\n\n    Esclareceu de forma objetiva que a fatura vencida deve ser paga separadamente e que o novo cartão será utilizado nas próximas cobranças.\n\nPontos fracos / Oportunidades de melhoria\n\n    Ao tratar da atualização da forma de pagamento, é importante utilizar as modalidades disponíveis pela empresa: débito em conta corrente ou cartão de crédito.\n\n    Evitar perguntar ao cliente se o cartão é de crédito ou débito, pois não trabalhamos com cartão de débito. O ideal é confirmar diretamente se deseja cadastrar um cartão de crédito ou utilizar o débito em conta corrente, conforme as opções disponíveis.","prazo_feedback":null,"htb":"HTB…6975","pontos":[],"tem_relato":false},{"id":"684","data":"14/10/2026","criado_em":"15/10/2026","nota":82.0,"nota_bruta":82.0,"falha_grave":false,"monitor":"Paula Fernanda Alves","tipo":"Supervisor · Não venda","status":"Finalizada","ciencia":null,"itens":[{"grupo":"Comunicação","item":"Deixou de responder a mensagem cumprindo as regras gramaticais, de ortografia, pontuação e acentuação (whatsapp)"},{"grupo":"Processos de atendimento","item":"Manteve a solução negociada anteriormente pelo colega/oferta recebidas pelos canais digitais e SMS"},{"grupo":"Registro","item":"Reclassificou o registro conforme Base de Conhecimento"}],"falhas_graves":[],"aderencia":0.9434,"itens_avaliados":53,"feedback":"Resumo dos pontos principais\n• Cliente informou ter efetuado pagamento no sábado via código/Pix e que o sinal não foi reativado.\n• Atendente solicitou e confirmou dados cadastrais (nome, CPF, data de nascimento) para verificação no sistema.\n• Atendente identificou que a negociação anterior estava cancelada e explicou que a baixa depende do processamento do sistema (impactado por feriado).\nPontos fortes\n\nValidação cadastral completa (nome, CPF e data de nascimento) solicitada e confirmada.\n\nConfirmação do e-mail para envio de protocolo e confirmação do número de telefone ativo.\n\nTom cordial e encerramento educado, oferecendo retorno caso necessário.\nPontos fracos\n\nNão houve apresentação do atendente e da empresa no início da chamada.\n\nNão solicitou os 3 dígitos do CPF conforme procedimento de segurança.\n\nNão explorou soluções imediatas (comprovante de pagamento, aceleração ou opções comerciais).\n\nManteve a solução negociada anteriormente pelo colega/oferta recebidas pelos canais digitais e SMS","prazo_feedback":null,"htb":"HTB…8167","pontos":[],"tem_relato":false},{"id":"523","data":"08/10/2026","criado_em":"08/10/2026","nota":83.0,"nota_bruta":83.0,"falha_grave":false,"monitor":"Paula Fernanda Alves","tipo":"Supervisor · Não venda","status":"Finalizada","ciencia":null,"itens":[{"grupo":"Acolhimento","item":"Demonstrou sorriso/energia na voz durante o atendimento."},{"grupo":"Comunicação","item":"Conduziu o atendimento de forma clara e objetiva"},{"grupo":"Comunicação","item":"Demonstrou confiança e segurança durante o atendimento"}],"falhas_graves":[],"aderencia":0.88,"itens_avaliados":25,"feedback":"Pontos fortes:\n\nRealizou validação cadastral completa.\nInformou protocolo e gravação da ligação.\nExplicou a origem e o valor proporcional da cobrança.\nApresentou condição de desconto.\n\nPontos de atenção:\n\nConsultar sempre o histórico do período questionado e verificar o que o atendimento anterior registrou, pois havia informações que poderiam facilitar a explicação e acalmar o cliente.\nMelhorar a clareza ao explicar datas e períodos.\nDemonstrar mais segurança na voz e na condução, pois o cliente percebeu a contatos e envio de comprovantes.\n\nComunicação confusa ao informar o número do protocolo.\n\n\nFechamento sem checagem explícita de dúvidas do cliente.\n\n\nFeedback\n\nA operadora foi atenciosa e disponível durante o atendimento. Ao ser informada sobre a promessa de isenção da multa, poderia ter adotado uma postura mais tranquila, informando ao cliente que estava atendendo à solicitação e pedindo que aguardasse enquanto verificava o caso, pois já havia no sistema a orientação para cancelamento da multa.\n\nComo oportunidade de melhoria, em alguns momentos interrompe a fala do cliente, prejudicando a escuta ativa, principalmente diante de um cliente mais exaltado. Também não apresentou as facilidades do serviço, como Área do Assinante, aplicativo e WhatsApp.\n\nQuando o cliente solicitou uma cópia do e-mail da contestação, foi orientado a consultar a Área do Assinante. O correto seria orientá-lo a verificar no aplicativo ou na Área do Assinante a situação da fatura, pois não é enviado e-mail nesses casos. Por fim, não informou sobre a PSAT antes da transferência do atendimento.","prazo_feedback":null,"htb":"HTB…2116","pontos":[],"tem_relato":false}],"relatos":null}},"gerado_em":"27/10 às 12:01","excecoes":null,"pessoa":{"nome":"Luzia Santos","turno":"Manhã","supervisor":"Paula Fernanda Alves","negociado":26041.75,"recebido":15250.38,"conversao":0.5856,"clientes_negociados":124,"clientes_recebidos":92,"faturas_negociadas":336,"ticket_medio":165.76,"chamadas":211,"tma_seg":548.919,"pausa_pct":35.7,"daily_negociado":[1241.66,1289.63,1359.29,0.0,2440.79,1851.5,0.0,504.12,1594.3,0.0,0.0,1057.51,1428.87,941.07,1312.9,1671.94,1062.72,0,0.0,1323.81,959.81,2097.77,1790.46,702.48,0.0,1411.12],"daily_recebido":[460.63,1089.94,460.69,0.0,1654.98,1306.99,528.13,289.56,1102.79,153.66,0.0,743.93,883.55,489.09,691.59,369.63,460.99,0.0,332.34,568.26,460.24,1760.23,328.14,0.0,96.96,1018.06],"score":44,"partes":{"resultado":34.3,"conversao":58.6,"produtividade":50.3,"evolucao":29. <script>
(function(){
'use strict';
const D=JSON.parse(document.getElementById('dd').textContent);
const T=D.equipe, P=D.pessoa;

const _b0=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const _b2=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});
const _nf=new Intl.NumberFormat('pt-BR');
const brl=v=>_b0.format(v||0), brl2=v=>_b2.format(v||0), nf=v=>_nf.format(Math.round(v||0));
const pc=(v,d=1)=>(v*100).toFixed(d).replace('.',',')+'%';
const kb=v=>'R$'+(Math.abs(v)>=1000?(v/1000).toFixed(0)+'k':Math.round(v));
const tm=s=>s==null?'—':String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.round(s%60)).padStart(2,'0');
const ini=f=>{const p=f.split(' ').filter(Boolean);return((p[0]?.[0]||'')+(p[p.length-1]?.[0]||'')).toUpperCase()};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const sum=a=>a.reduce((x,y)=>x+y,0), avg=a=>a.length?sum(a)/a.length:0;

/* faixa de performance — linguagem para quem recebe, não veredito */
const faixa = P.score>=85?{t:'EXCELENTE',c:'#34D399'}
            : P.score>=70?{t:'BOM',c:'#22D3EE'}
            : P.score>=50?{t:'EM EVOLUÇÃO',c:'#FFB020'}
                         :{t:'EM DESENVOLVIMENTO',c:'#A78BFA'};
const acc=faixa.c;
const rgba=(h,a)=>{h=h.replace('#','');return`rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`};
document.documentElement.style.setProperty('--acc',acc);
document.documentElement.style.setProperty('--accbg',rgba(acc,.11));
document.documentElement.style.setProperty('--accbd',rgba(acc,.4));

/* ---------- gráficos SVG ---------- */
let uid=0; const nid=()=>'g'+(++uid);
function spark(d,c,w=250,h=32){
  if(!d.length)return'';
  const hi=Math.max(...d)||1, X=i=>i*w/(d.length-1||1), Y=v=>h-2-(v/hi)*(h-6);
  const p=d.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' '), g=nid();
  return`<svg class="sp" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" height="${h}" style="width:100%">
   <defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="${c}" stop-opacity=".3"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
   <polygon points="0,${h} ${p} ${w},${h}" fill="url(#${g})"/>
   <polyline points="${p}" fill="none" stroke="${c}" stroke-width="1.4"/></svg>`;
}
function barras({labels,series,w=760,h=290}){
  const pad={t:34,r:14,b:34,l:12}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const n=labels.length;
  // com poucos dias (inicio do mes) da pra escrever o valor em cima de cada
  // barra; com muitos dias isso vira poluicao — nesse caso some com os
  // rotulos individuais e deixa so a barra + tooltip ao passar o mouse.
  const denso = n>12;
  const hi=(Math.max(...series.flatMap(s=>s.data))||1)*(denso?1.14:1.28);
  const grupo=iw/n, largBarra=denso?Math.max(2,Math.min(9,grupo/(series.length+1)))
                                  :Math.min(22,grupo/(series.length+1.6));
  const Y=v=>pad.t+ih-(v/hi)*ih;
  let s='';
  for(let i=0;i<=3;i++){const v=hi*i/3,y=Y(v);
    s+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w-pad.r}" y2="${y.toFixed(1)}" stroke="#1A2433"/>`;
    if(denso) s+=`<text x="${pad.l}" y="${(y-3).toFixed(1)}" fill="#48596E" font-size="8">${kb(v)}</text>`;}
  const passoRotulo = denso ? Math.ceil(n/9) : 1;
  labels.forEach((l,i)=>{
    const cx=pad.l+grupo*i+grupo/2;
    if(i%passoRotulo===0 || i===n-1)
      s+=`<text x="${cx.toFixed(1)}" y="${h-9}" fill="#7C8FA6" font-size="${denso?9:10}" font-weight="700" text-anchor="middle">${l}</text>`;
    series.forEach((se,si)=>{
      const v=se.data[i]||0;
      const bh=Math.max(1,(v/hi)*ih);
      const bx=cx - (series.length*largBarra)/2 + si*largBarra + (denso?0.6:1.5);
      const by=pad.t+ih-bh;
      s+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${(largBarra-(denso?1.2:3)).toFixed(1)}" height="${bh.toFixed(1)}"
        fill="${se.color}" rx="${denso?1:2.5}"><title>${l} · ${se.name}: ${brl(v)}</title></rect>`;
      if(v>0 && !denso){
        const rotulo = v>=1000 ? (v/1000).toFixed(1).replace('.0','')+'k' : String(Math.round(v));
        s+=`<text x="${(bx+(largBarra-3)/2).toFixed(1)}" y="${(by-5).toFixed(1)}" fill="${se.color}"
          font-size="9.5" font-weight="700" text-anchor="middle">${rotulo}</text>`;
      }
    });
  });
  let lx=pad.l;
  series.forEach(se=>{s+=`<rect x="${lx}" y="8" width="9" height="2.5" fill="${se.color}"/>
    <text x="${lx+14}" y="13" fill="#7C8FA6" font-size="9" letter-spacing=".13em">${se.name.toUpperCase()}</text>`;
    lx+=26+se.name.length*6.6;});
  if(denso) s+=`<text x="${w-pad.r}" y="20" fill="#48596E" font-size="8.5" text-anchor="end">passe o mouse p/ ver o valor</text>`;
  return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">${s}</svg>`;
}

function vs(meu,ref,maiorMelhor=true){
  if(!ref) return{cls:'eq',txt:'—'};
  const d=(meu-ref)/ref, bom=maiorMelhor?d>0:d<0;
  if(Math.abs(d)<0.03) return{cls:'eq',txt:'na média do time'};
  return{cls:bom?'up':'dn', txt:(d>0?'▲ ':'▼ ')+pc(Math.abs(d),0)+' vs. média'};
}
function kpi(l,v,cmp,sp,spc){
  return`<div class="k"><div class="l">${l}</div><div class="v n">${v}</div>
    ${cmp?`<div class="d ${cmp.cls}">${cmp.txt}</div>`:''}
    ${sp?`<div class="sp">${spark(sp,spc)}</div>`:''}</div>`;
}

/* ---------- diagnóstico em segunda pessoa ---------- */
function diagnostico(){
  const o=[];
  const add=(tag,c,html)=>o.push({tag,c,html});
  const convCli=P.clientes_recebidos/P.clientes_negociados;
  const gap=convCli-P.conversao;

  if(P.observacao) add('CONTEXTO','#A78BFA',P.observacao);

  /* o insight mais acionável: cliente x valor */
  if(gap>0.06)
    add('FOCO','#FFB020',`<b>${pc(convCli,0)} dos clientes</b> que você negocia acabam pagando, mas isso representa só
      <b>${pc(P.conversao,0)} do valor</b>. Os acordos que não se concretizam são justamente os
      <b>de ticket mais alto</b>. Ganhar aqui não exige negociar mais gente — exige cuidado redobrado
      no fechamento dos acordos grandes.`);
  else if(gap<-0.06)
    add('PONTO FORTE','#34D399',`Você converte <b>${pc(P.conversao,0)} do valor</b> negociado, acima da sua conversão de
      clientes (${pc(convCli,0)}). Isso significa que <b>seus acordos grandes se sustentam</b> — é exatamente o
      comportamento mais difícil de conseguir em cobrança.`);

  if(P.conversao>=T.conversao+0.08)
    add('PONTO FORTE','#34D399',`Sua conversão de <b>${pc(P.conversao)}</b> está <b>${pc(P.conversao-T.conversao,1)} acima</b>
      da média da operação (${pc(T.conversao)}). Você fecha melhor do que a maior parte do time.`);
  else if(P.conversao<=T.conversao-0.08)
    add('OPORTUNIDADE','#FFB020',`Sua conversão está em <b>${pc(P.conversao)}</b>, contra ${pc(T.conversao)} da média da operação.
      É o indicador com maior espaço de ganho no seu resultado hoje.`);

  if(P.chamadas>=T.chamadas_pessoa*1.15)
    add('VOLUME','#22D3EE',`Você fez <b>${nf(P.chamadas)} chamadas</b>, acima da média de ${nf(T.chamadas_pessoa)} por pessoa.
      Esforço não é o seu gargalo.`);
  else if(P.chamadas<=T.chamadas_pessoa*0.85)
    add('VOLUME','#FFB020',`Você fez <b>${nf(P.chamadas)} chamadas</b>, abaixo da média de ${nf(T.chamadas_pessoa)} por pessoa.
      Com a sua taxa de conversão atual, cada bloco de chamadas a mais tende a virar resultado.`);

  if(P.tma_seg>T.tma_seg*1.25)
    add('TEMPO','#FFB020',`Seu TMA é <b>${tm(P.tma_seg)}</b>, contra ${tm(T.tma_seg)} da equipe. Nem sempre é ruim —
      atendimento mais longo pode significar negociação mais cuidadosa. Vale checar se o tempo extra
      está virando acordo ou se está preso em ligações que não avançam.`);
  else if(P.tma_seg<T.tma_seg*0.8 && P.conversao<T.conversao)
    add('TEMPO','#FFB020',`Seu TMA é <b>${tm(P.tma_seg)}</b>, bem abaixo dos ${tm(T.tma_seg)} da equipe, e sua conversão está
      abaixo da média. A combinação sugere ligações encerradas antes de explorar todas as opções de acordo.`);

  if(P.pausa_pct>20)
    add('DISCIPLINA','#F43F5E',`Sua pausa sobre tempo logado está em <b>${P.pausa_pct.toFixed(1).replace('.',',')}%</b>,
      contra ${T.pausa_pct.toFixed(1).replace('.',',')}% da operação. É tempo de contato que deixa de existir.`);

  if(P.tendencia>=0.15)
    add('TENDÊNCIA','#34D399',`Você <b>subiu ${pc(P.tendencia,0)}</b> na média diária de recebimento entre a 1ª e a 2ª metade
      do período. O que mudou na sua rotina vale ser mantido.`);
  else if(P.tendencia<=-0.15)
    add('TENDÊNCIA','#FFB020',`Sua média diária de recebimento <b>caiu ${pc(Math.abs(P.tendencia),0)}</b> da 1ª para a 2ª metade
      do período. Vale olhar o que era diferente nos primeiros dias.`);

  if(P.cv>0.55)
    add('CONSTÂNCIA','#FFB020',`Seus dias variam bastante: a média é ${brl(P.media_dia)} e seu melhor dia foi
      <b>${brl(P.melhor_valor)}</b> (${P.melhor_dia}). Reduzir a oscilação costuma render mais que
      buscar um dia excepcional — <b>a regularidade é o que sustenta o mês</b>.`);
  else if(P.cv<0.35)
    add('CONSTÂNCIA','#34D399',`Seus resultados são <b>regulares</b> ao longo do mês, com pouca oscilação entre os dias.
      Constância é uma vantagem real: torna o resultado previsível.`);

  if(P.ticket_medio>=T.ticket_medio*1.15)
    add('TICKET','#22D3EE',`Seu ticket médio de <b>${brl2(P.ticket_medio)}</b> está acima dos ${brl2(T.ticket_medio)} da operação —
      você trabalha acordos de valor mais alto que a média.`);

  if(!o.length) add('RESUMO','#22D3EE','Seus indicadores estão dentro da faixa da equipe, sem desvios relevantes no período.');
  return o;
}

/* ---------- próximo passo: uma ação só, a de maior alavanca ---------- */
function proximoPasso(){
  const convCli=P.clientes_recebidos/P.clientes_negociados, gap=convCli-P.conversao;
  const alvo=Math.min(0.95,Math.max(P.conversao+0.05,T.conversao));
  const ganho=P.negociado*(alvo-P.conversao);
  if(P.pausa_pct>20) return{t:'Recuperar tempo de operação',
    p:`Sua pausa está em <b>${P.pausa_pct.toFixed(1).replace('.',',')}%</b> do tempo logado, contra ${T.pausa_pct.toFixed(1).replace('.',',')}% da operação.
       Trazer esse número para o patamar do time devolve tempo de contato sem exigir nada além do que você já faz.`};
  if(gap>0.06) return{t:'Blindar os acordos de maior valor',
    p:`Você já leva <b>${pc(convCli,0)} dos clientes</b> ao pagamento — a técnica de negociação funciona. A perda está concentrada
       nos acordos de <b>ticket mais alto</b>. Nesses casos, confirme data, forma de pagamento e envie o lembrete antes do vencimento.
       Subir sua conversão de valor para ${pc(alvo,0)} representa <b>${brl(ganho)}</b> a mais no mês.`};
  if(P.conversao<T.conversao) return{t:'Fechar com mais firmeza',
    p:`Sua conversão está ${pc(T.conversao-P.conversao,1)} abaixo da média da operação. Chegar a ${pc(alvo,0)} — o patamar do time —
       representa <b>${brl(ganho)}</b> a mais no mês, <b>sem precisar negociar um cliente sequer a mais</b>.`};
  if(P.chamadas<T.chamadas_pessoa*0.9) return{t:'Ampliar o volume de contato',
    p:`Sua conversão de <b>${pc(P.conversao)}</b> está acima da média, mas seu volume de chamadas está abaixo.
       Você converte bem o que toca — tocar mais é o caminho mais curto para crescer.`};
  if(P.cv>0.55) return{t:'Transformar o pico em rotina',
    p:`Seu melhor dia foi <b>${brl(P.melhor_valor)}</b> e sua média é ${brl(P.media_dia)}. Você já provou que consegue.
       Repetir a rotina daquele dia com regularidade vale mais que buscar um novo recorde.`};
  return{t:'Manter e documentar o que funciona',
    p:`Seus indicadores estão acima da operação em praticamente todas as dimensões. O maior ganho agora é
       <b>registrar sua abordagem</b> para que ela vire referência para o time.`};
}

function detalheDias(){
  const dr=P.daily_recebido, dt=D.datas;
  // ultimos dias com QUALQUER negociacao aberta no periodo (nao conta os
  // que ficaram zerados por fim de semana/feriado sem expediente)
  const idx=[];
  for(let i=dr.length-1;i>=0 && idx.length<5;i--){
    if((P.daily_negociado[i]||0)>0 || (dr[i]||0)>0) idx.push(i);
  }
  idx.reverse();
  if(!idx.length) return '<p class="prose" style="color:var(--dim);font-size:12.5px">Sem dias com movimento neste período.</p>';

  const media=P.media_dia||0;
  const maxV=Math.max(media, ...idx.map(i=>dr[i]||0), 1);
  const linha=(rotulo,valor,destaque)=>{
    const v=valor||0;
    const diff = media>0 ? (v-media)/media : 0;
    const cls = Math.abs(diff)<0.05?'eq':diff>0?'up':'dn';
    const seta = cls==='up'?'▲':cls==='dn'?'▼':'▬';
    const cor = destaque ? '#FFB020' : (v>=media ? '#34D399' : '#7C8FA6');
    return `<div class="dia-row${destaque?' media':''}">
      <span class="dia-data">${rotulo}</span>
      <span class="dia-t"><i style="width:${Math.min(100,v/maxV*100)}%;background:${cor}"></i></span>
      <span class="dia-v n" style="color:${destaque?'#FFB020':'inherit'}">${brl(v)}</span>
      <span class="dia-d n ${cls}">${destaque?'':seta+' '+pc(Math.abs(diff),0)}</span>
    </div>`;
  };

  let html='<div class="dias">';
  idx.forEach((i,k)=>{
    const rot = k===idx.length-1 ? `<b>${dt[i]} · hoje</b>` : dt[i];
    html+=linha(rot, dr[i]);
  });
  html+=linha('MÉDIA DO PERÍODO', media, true);
  html+='</div>';
  html+=`<p class="prose" style="font-size:11.5px;line-height:1.6;color:var(--faint);margin-top:14px">
    A seta compara cada dia com a sua própria média — não com colegas. Dias sem negociação
    aberta (fim de semana ou folga) não entram nesta lista.</p>`;
  return html;
}

/* ---------- qualidade: PSAT (aba) + monitorias (aba) ---------- */
const Q=D.qualidade||null;
const QS=Q&&Q.psat, QMx=Q&&Q.monit, QM=(QMx&&QMx.lista)||[];
const pcN=v=>v==null?'—':pc(v,0);
const n1=v=>v==null?'—':v.toFixed(1).replace('.',',');
const nMon=v=>v==null?'—':(Math.round(v*10)/10).toString().replace('.',',');
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const nomeMes=c=>c?MESES[+c.slice(5,7)-1]:'';
function vsPP(meu,ref,maiorMelhor=true){
  if(meu==null||ref==null) return {cls:'eq',txt:'—'};
  const d=(meu-ref)*100, bom=maiorMelhor?d>0:d<0;
  if(Math.abs(d)<2) return {cls:'eq',txt:'na média do time'};
  return {cls:bom?'up':'dn',txt:(d>0?'▲ ':'▼ ')+Math.abs(d).toFixed(0)+' p.p. vs. média'};
}
function vsPts(meu,ref){
  if(meu==null||ref==null) return {cls:'eq',txt:'—'};
  const d=meu-ref; if(Math.abs(d)<1.5) return {cls:'eq',txt:'na média do time'};
  return {cls:d>0?'up':'dn',txt:(d>0?'▲ ':'▼ ')+nMon(Math.abs(d))+' pts vs. média'};
}
const corMon=n=>n==null?'#7C8FA6':n>=90?'#34D399':n>=80?'#22D3EE':n>=70?'#FFB020':'#F43F5E';
const rotMon=n=>n==null?'SEM NOTA':n>=90?'EXCELENTE':n>=80?'BOM':n>=70?'EM EVOLUÇÃO':'PRECISA DE ATENÇÃO';
const chip=(n,inv)=>inv?'<span class="chip cx">INVÁL.</span>':n==null?'<span class="chip cx">—</span>':`<span class="chip c${n}">${n}</span>`;
function diasAteBR(br){ if(!br) return null; const p=br.split('/').map(Number); const y=p[2]||new Date().getFullYear();
  const a=new Date(y,p[1]-1,p[0]), h=new Date(); h.setHours(0,0,0,0); return Math.round((a-h)/86400000); }

/* ===== aba PSAT ===== */
function pDestaque(){
  const meu=QS&&QS.meu; if(!meu||!meu.validas_atendente) return '';
  const f=[], dz=Math.round((meu.csat_atendente||0)*10);
  f.push(`De cada <b>10 clientes</b> que deram nota para o seu atendimento, <span class="hl">${dz}</span> deram 4 ou 5.`);
  f.push(meu.detratores?`<b>${meu.detratores} nota${meu.detratores>1?'s':''} baixa${meu.detratores>1?'s':''}</b> (1 ou 2) no período — destacadas em vermelho na lista abaixo.`
                       :'<b>Nenhuma nota baixa</b> (1 ou 2) no período.');
  if(meu.validas_atendente<5) f.push(`Amostra ainda pequena (${meu.validas_atendente} nota${meu.validas_atendente>1?'s':''}): o percentual muda bastante a cada pesquisa nova.`);
  if(meu.rechamada!=null && QS.equipe.rechamada!=null && meu.rechamada>QS.equipe.rechamada+0.05)
    f.push(`<b>${pc(meu.rechamada,0)}</b> dos seus clientes ligaram de novo em até 3 dias (equipe: ${pc(QS.equipe.rechamada,0)}). Fechar a ligação com tudo resolvido — boleto, data e próximo passo claros — evita a volta.`);
  return `<div class="hi"><div class="ic">PSAT</div><div style="flex:1">
    <h4>COMO O CLIENTE AVALIA O SEU ATENDIMENTO</h4><p>${f.join(' ')}</p></div></div>`;
}
function pKpis(){
  if(!QS) return `<div class="pn"><div class="vazio">PSAT: dado não disponível
    <p>A pesquisa de satisfação ainda não entrou nesta atualização do painel.</p></div></div>`;
  const meu=QS.meu, E=QS.equipe;
  if(!meu) return `<div class="pn"><div class="vazio">Nenhuma pesquisa PSAT sua em ${QS.periodo}
    <p>Assim que clientes atendidos por você responderem a pesquisa, as notas aparecem aqui.</p></div></div>`;
  return `<div class="kpis qk" style="grid-template-columns:repeat(5,1fr)">
    ${kpi('Pesquisas recebidas',nf(meu.pesquisas),{cls:'eq',txt:nf(meu.validas_atendente)+' com nota válida'})}
    ${kpi('Satisfação com você',pcN(meu.csat_atendente),vsPP(meu.csat_atendente,E.csat_atendente))}
    ${kpi('Nota média',n1(meu.media_atendente),vs(meu.media_atendente,E.media_atendente))}
    ${kpi('Solução aprovada',pcN(meu.csat_solucao),vsPP(meu.csat_solucao,E.csat_solucao))}
    ${kpi('Ligou de novo em 3d',pcN(meu.rechamada),vsPP(meu.rechamada,E.rechamada,false))}
  </div>`;
}
function pNotas(){
  const meu=QS&&QS.meu;
  if(!meu||!meu.validas_atendente) return '';
  const tv=meu.validas_atendente, E=QS.equipe, ev=E.validas_atendente||1;
  const cor={5:'#34D399',4:'#34D399',3:'#FFB020',2:'#F43F5E',1:'#F43F5E'};
  let rows='';
  for(let k=5;k>=1;k--){
    const q=meu.dist_atendente[k-1], p=q/tv, pe=E.dist_atendente[k-1]/ev;
    rows+=`<div class="nt5-r"><span class="l">NOTA ${k}</span>
      <span class="t"><i style="width:${(p*100).toFixed(1)}%;background:${cor[k]}"></i>
        <b style="left:calc(${(pe*100).toFixed(1)}% - 1px)" title="Média da equipe: ${pc(pe,0)}"></b></span>
      <span class="v n">${q} <span>· ${pc(p,0)}</span></span></div>`;
  }
  return `<div class="pn"><div class="pn-h"><h3>Como os clientes avaliam você</h3><span class="nt">nota do atendimento · 1 a 5</span></div>
    <div class="pn-b"><div class="nt5">${rows}</div>
    <p class="prose" style="font-size:11.5px;line-height:1.6;color:var(--faint);margin-top:12px">
    A barra é a sua distribuição de notas. O traço claro mostra a média da equipe na mesma nota.
    ${meu.invalidas||meu.sem_resposta?`Fora da conta: ${meu.sem_resposta} sem resposta e ${meu.invalidas} inválida${meu.invalidas===1?'':'s'}.`:''}</p></div></div>`;
}
function pLista(){
  if(!QS||!QS.meu||!QS.lista.length) return '';
  const L=QS.lista.filter(r=>r.atendente!=null||r.solucao!=null||r.inv||r.rechamada!=null);
  const fora=QS.lista.length-L.length;
  if(!L.length) return '';
  const sn=v=>v===true?'<span style="color:var(--amber)">Sim</span>':v===false?'<span style="color:var(--dim)">Não</span>':'<span style="color:var(--faint)">—</span>';
  return `<div class="pn"><div class="pn-h"><h3>Suas pesquisas de satisfação</h3>
    <span class="nt">${QS.periodo} · notas 1 e 2 em destaque</span></div>
    <div class="pn-b" style="overflow-x:auto"><table class="acd"><thead><tr>
      <th class="l">Data</th><th class="l">Hora</th><th class="l">Fila</th>
      <th>Atendimento</th><th>Solução</th><th>Ligou de novo</th><th class="l">Cliente</th>
    </tr></thead><tbody>
    ${L.map(r=>`<tr class="${r.atendente!=null&&r.atendente<=2?'det':''}">
      <td class="l">${r.data}</td><td class="l" style="color:var(--dim)">${r.hora}</td>
      <td class="l" style="color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em">${esc(r.fila)}</td>
      <td>${chip(r.atendente,r.inv)}</td><td>${chip(r.solucao,r.inv)}</td><td>${sn(r.rechamada)}</td>
      <td class="l" style="color:var(--dim);font-size:10.5px">${r.htb||'—'}</td></tr>`).join('')}
    </tbody></table>
    ${fora?`<p class="prose" style="font-size:11.5px;color:var(--faint);margin-top:12px">${fora} pesquisa${fora>1?'s':''} em que o cliente não respondeu nada ${fora>1?'ficaram':'ficou'} fora da lista.</p>`:''}
    </div></div>`;
}
const atualizado=()=>D.gerado_em?`<div class="lbl" style="text-align:right;margin-top:14px">Atualizado em ${D.gerado_em}</div>`:'';
function abaPSAT(){
  return atualizado()+pDestaque()+pKpis()+pNotas()+pLista()+
  `<div class="ft" style="margin-top:16px"><b>Como ler:</b> o PSAT é a pesquisa que o cliente responde ao fim da ligação
    ${QS?`(${QS.periodo})`:''}. <b>Satisfação com você</b> é o percentual de notas 4 e 5 para o atendimento. <b>Solução aprovada</b>
    é o mesmo cálculo para a nota da solução. <b>Ligou de novo em 3d</b> mostra quantos clientes voltaram a ligar em até
    3 dias (quanto menor, melhor). Respostas inválidas ou em branco não entram nas contas. A comparação é com a
    <b>média da equipe de cobrança</b>, sem identificar ninguém. Dúvida? Fale com ${esc(P.supervisor)}.</div>`;
}

/* ===== aba MONITORIAS ===== */
function mDestaque(){
  const M=QMx.mes, E=QMx.equipe, mes=nomeMes(QMx.competencia), f=[];
  if(!M||!M.qtd){
    f.push(`Você ainda não teve monitoria em <b>${mes}</b>.`+(QM.length?` A mais recente foi em ${QM[0].data||'—'}, com nota <span class="hl">${nMon(QM[0].nota)}</span>.`:''));
  }else{
    f.push(`Em <b>${mes}</b> você teve <b>${M.qtd} monitoria${M.qtd>1?'s':''}</b>${QMx.meta?` de ${QMx.meta} previstas`:''}, com nota média
      <span class="hl">${nMon(M.media)}</span>${E.media_nota!=null?` (equipe: ${nMon(E.media_nota)})`:''}.`);
    if(M.falhas_graves){
      const g=QM.find(m=>m.falha_grave&&m.falhas_graves.length);
      f.push(`<b style="color:var(--red)">${M.falhas_graves} falha${M.falhas_graves>1?'s':''} grave${M.falhas_graves>1?'s':''}</b> zerou${M.falhas_graves>1?'ram':''} nota${M.falhas_graves>1?'s':''}
        ${M.perdeu_por_falha?`— foram <b>${nMon(M.perdeu_por_falha)} pontos</b> perdidos que você já tinha conquistado na ligação`:''}${g?`. Motivo: <b>${esc(g.falhas_graves[0].item)}</b>`:''}.`);
    }
  }
  const r=(QMx.recorrentes||[]).find(x=>x.vezes>=2);
  if(r) f.push(`O ponto que mais se repete nas suas monitorias: <b>${esc(r.item)}</b> (${r.vezes} vezes). Corrigir este item é o caminho mais rápido para subir a nota.`);
  else if(M&&M.qtd&&!M.falhas_graves&&(M.media||0)>=95) f.push('Nenhum ponto se repete — mantenha o padrão.');
  return `<div class="hi"><div class="ic">MONITORIA</div><div style="flex:1">
    <h4>COMO A MONITORIA VÊ O SEU ATENDIMENTO</h4><p>${f.join(' ')}</p></div></div>`;
}
function mKpis(){
  const M=QMx.mes||{qtd:0}, E=QMx.equipe, ult=QM[0];
  const qtdTxt=QMx.meta?{cls:M.qtd>=QMx.meta?'up':'eq',txt:`${M.qtd} de ${QMx.meta} previstas`}
                       :(E.por_pessoa?{cls:'eq',txt:'equipe: '+nMon(E.por_pessoa)+' por pessoa'}:null);
  return `<div class="kpis qk" style="grid-template-columns:repeat(5,1fr)">
    ${kpi('Monitorias em '+nomeMes(QMx.competencia),nf(M.qtd),qtdTxt)}
    ${kpi('Nota média do mês',nMon(M.media),vsPts(M.media,E.media_nota))}
    ${kpi('Última nota',ult?nMon(ult.nota):'—',ult?{cls:'eq',txt:'ligação de '+(ult.data||'—').slice(0,5)}:null)}
    ${kpi('Itens atendidos',M.aderencia!=null?pc(M.aderencia,0):'—',{cls:'eq',txt:'da ficha, no mês'})}
    ${kpi('Falhas graves',nf(M.falhas_graves||0),{cls:(M.falhas_graves?'dn':'up'),txt:M.falhas_graves?'zeram a nota':'nenhuma no mês'})}
  </div>`;
}
function mEvolucao(){
  const cab=`<div class="pn-h"><h3>Evolução das suas notas</h3><span class="nt">últimas monitorias · 0 a 100</span></div>`;
  if(!QM.length) return `<div class="pn">${cab}<div class="vazio">Nenhuma monitoria ainda
    <p>Quando seu supervisor monitorar uma ligação sua, a nota aparece aqui.</p></div></div>`;
  const s=QM.slice(0,10).reverse();
  const H=110, bars=s.map(m=>{const c=corMon(m.nota), h=Math.max(3,(m.nota||0)/100*H), hb=m.falha_grave&&m.nota_bruta?m.nota_bruta/100*H:0;
    return `<div title="${m.data||''} · nota ${nMon(m.nota)}${hb?' (seria '+nMon(m.nota_bruta)+')':''}">
      <em style="color:${c}">${nMon(m.nota)}</em>
      <span style="position:relative;width:100%;height:${H}px;display:flex;align-items:flex-end">
        ${hb?`<i style="position:absolute;bottom:0;left:0;right:0;height:${hb}px;border:1px dashed #F43F5E;background:rgba(244,63,94,.06)"></i>`:''}
        <i style="height:${h}px;background:${c};position:relative;width:100%"></i></span>
      <span>${(m.data||'—').slice(0,5)}</span></div>`;}).join('');
  return `<div class="pn">${cab}<div class="pn-b"><div class="evo" style="height:${H+44}px">${bars}</div>
    ${s.some(m=>m.falha_grave)?`<p class="prose" style="font-size:11.5px;color:var(--faint);margin-top:10px">
      Contorno tracejado em vermelho = nota que você teria sem a falha grave.</p>`:''}</div></div>`;
}
function mRecorrentes(){
  const R=QMx.recorrentes||[];
  const cab=`<div class="pn-h"><h3>Onde você mais perde ponto</h3><span class="nt">itens não cumpridos · todas as monitorias</span></div>`;
  if(!QM.length) return `<div class="pn">${cab}<div class="vazio">Sem monitorias</div></div>`;
  if(!R.length) return `<div class="pn">${cab}<div class="vazio" style="color:var(--green)">Nenhum item perdido
    <p>Em todas as suas monitorias você cumpriu os itens da ficha.</p></div></div>`;
  const mx=Math.max(...R.map(x=>x.vezes));
  return `<div class="pn">${cab}<div class="pn-b">${R.map(x=>`<div class="rc">
    <div class="rc-t"><span class="rc-g" style="${x.grupo==='Falha grave'?'color:var(--red)':''}">${esc(x.grupo)}</span>
      ${x.vezes>=2?'<span class="urg venc">repetiu</span>':''}</div>
    <div class="rc-i"><span style="color:${x.grupo==='Falha grave'?'var(--red)':'var(--amber)'};font-family:var(--mono);font-weight:700">✗ </span>${esc(x.item)}</div>
    <div class="rc-b"><i style="width:${x.vezes/mx*100}%;background:${x.grupo==='Falha grave'?'#F43F5E':x.vezes>=2?'#FFB020':'#7C8FA6'}"></i><span>${x.vezes}×</span></div>
  </div>`).join('')}</div></div>`;
}
function mDetalhe(){
  if(!QM.length) return '';
  const temRel=QMx.relatos && QM.some(m=>m.tem_relato);
  const grupos=L=>{const g={}; L.forEach(x=>(g[x.grupo]=g[x.grupo]||[]).push(x.item)); return g;};
  const cards=QM.map((m,i)=>{const c=corMon(m.nota), G=grupos(m.itens||[]);
    const dp=diasAteBR(m.prazo_feedback);
    return `<div class="mon" style="--c:${c}">
    <div class="mon-h"><div><div class="nota n">${nMon(m.nota)}<small> /100</small></div><div class="q">${rotMon(m.nota)}</div></div>
      <div class="meta">Ligação de <b>${m.data||'—'}</b>${m.criado_em?`<br>Monitorada em <b>${m.criado_em}</b>`:''}
        ${m.monitor?`<br>Por <b>${esc(m.monitor)}</b>`:''}${m.htb?`<br>Cliente <b>${m.htb}</b>`:''}</div></div>
    ${m.falha_grave?`<div class="fg"><b>FALHA GRAVE — nota zerada${m.nota_bruta?` (seria ${nMon(m.nota_bruta)})`:''}</b>
      ${(m.falhas_graves||[]).map(x=>`<div>▸ ${esc(x.item)}</div>`).join('')}</div>`:''}
    ${Object.keys(G).length?`<h5>Itens da ficha não atendidos</h5><ul>${Object.entries(G).map(([g,it])=>
      it.map(t=>`<li><b>${esc(g)}</b> — ${esc(t)}</li>`).join('')).join('')}</ul>`
      :(!m.falha_grave&&m.itens_avaliados?`<h5 style="color:var(--green)">Todos os ${m.itens_avaliados} itens avaliados foram atendidos</h5>`:'')}
    ${m.pontos&&m.pontos.length?`<h5>Pontos de melhoria</h5><ul>${m.pontos.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}
    ${m.feedback?`<h5>Feedback do supervisor</h5><div class="fb">${esc(m.feedback)}</div>`:''}
    ${m.prazo_feedback||m.ciencia?`<div class="mon-f">
      ${m.prazo_feedback?`<span class="urg ${dp!=null&&dp<0?'ok':dp===0?'hoje':'prox'}">${dp!=null&&dp<0?'feedback marcado para':'feedback até'} ${m.prazo_feedback.slice(0,5)}</span>`:''}
      ${m.ciencia?`<span class="urg ok">ciência: ${esc(m.ciencia)}</span>`:''}</div>`:''}
    ${m.tem_relato&&QMx.relatos?`<div class="rel" id="rel-${i}"></div>`:''}
  </div>`;}).join('');
  return `<div class="pn"><div class="pn-h"><h3>Suas monitorias, uma a uma</h3><span class="nt">da mais recente para a mais antiga</span></div>
    <div class="pn-b">
    ${temRel?`<div class="cad mini" id="q-cad"><p class="prose">O <b>relato de algumas ligações</b> cita o cliente pelo nome.
      Para ler, use a mesma senha da aba de acordos.</p>
      <input id="q-pw" type="password" placeholder="senha" autocomplete="off"><button id="q-go">Ver relatos</button>
      <div class="msg" id="q-msg"></div></div>`:''}
    ${cards}</div></div>`;
}
function abaMonit(){
  return atualizado()+mDestaque()+mKpis()+`<div class="g2">${mEvolucao()}${mRecorrentes()}</div>`+mDetalhe()+
  `<div class="ft" style="margin-top:16px"><b>Como ler:</b> cada monitoria é a avaliação de uma ligação sua, feita
    com a ficha de qualidade da cobrança. A nota vai de 0 a 100. Uma <b>falha grave</b> (por exemplo, não registrar
    o atendimento no Salesforce) <b>zera a nota</b>, mesmo que o resto da ligação tenha sido bom — por isso mostramos
    também quanto você teria tirado. <b>Itens atendidos</b> é o percentual de itens da ficha que você cumpriu, sem
    contar os que não se aplicavam à ligação. A média da equipe considera todas as monitorias do mês, sem

}

if(D.acordos_qtd){

  const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));

  function hojeISO(){const d=new Date();return [d.getFullYear(),d.getMonth()+1,d.getDate()];}
  function partes(br){ if(!br) return null; const[d,m,y]=br.split('/').map(Number); return [y,m,d]; }
  function diasAte(br){
    const p=partes(br); if(!p) return null;
    const a=new Date(p[0],p[1]-1,p[2]), h=hojeISO();
    return Math.round((a-new Date(h[0],h[1]-1,h[2]))/86400000);
  }
  function selo(br){
    const d=diasAte(br);
    if(d===null) return ['—','ok'];
    if(d<0)  return ['vencido há '+Math.abs(d)+'d','venc'];
    if(d===0) return ['vence hoje','hoje'];
    if(d<=3) return ['em '+d+'d','prox'];
    return ['em '+d+'d','ok'];
  }

  async function abrir(){
    const senha=inp.value;
    if(!senha){ msg.textContent='Digite a senha'; msg.className='msg err'; return; }
    bt.disabled=true; inp.disabled=true;
    msg.textContent='Abrindo…'; msg.className='msg';
    await new Promise(r=>setTimeout(r,40));
    let lista;
    try{
      const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey(
        {name:'PBKDF2',salt:b64(D.acordos.salt),iterations:D.acordos.it,hash:'SHA-256'},
        km,{name:'AES-GCM',length:256},false,['decrypt']);
      const plano=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.acordos.iv)},key,b64(D.acordos.ct));
      lista=JSON.parse(new TextDecoder().decode(plano));
    }catch(e){
      bt.disabled=false; inp.disabled=false; inp.value='';
      msg.textContent='Senha incorreta'; msg.className='msg err'; inp.focus(); return;
    }
    cad.remove(); render(lista);
  }

  function fones(a){
    const L=a.telefones||[];
    if(!L.length) return '<span style="color:var(--faint);font-size:10.5px">sem telefone</span>';

      + ', tudo bem? Sou da cobrança da HUBMAIS e estou entrando em contato sobre o seu acordo.');
    return '<div class="fones">' + L.map(f=>`<div class="fone">
      <span class="nb n">${f.exibir}</span>
      <a class="wa" href="https://wa.me/${f.link}?text=${msg}" target="_blank" rel="noopener"
         title="Abrir conversa no WhatsApp">✆</a>
      <a class="tel" href="tel:+${f.link}" title="Ligar">☏</a>
    </div>`).join('') + '</div>';
  }

  function render(L){
    const total=L.reduce((a,b)=>a+(b.valor||0),0);
    const vencidos=L.filter(a=>{const d=diasAte(a.vence_em); return d!==null&&d<0;}).length;
    const hoje=L.filter(a=>diasAte(a.vence_em)===0).length;
    alvo.innerHTML=`
      <div class="kpis" style="grid-template-columns:repeat(4,1fr);margin-top:0">
        ${kpi('Acordos na sua carteira',nf(L.length))}
        ${kpi('Valor negociado',brl(total))}
        ${kpi('Vencem hoje',nf(hoje))}
        ${kpi('Já vencidos',nf(vencidos))}
      </div>
      <div class="pn"><div class="pn-h"><h3>Seus acordos</h3>
        <span class="nt">ordenados por vencimento</span></div>
        <div class="pn-b" style="overflow-x:auto">
        <table class="acd"><thead><tr>
          <th class="l">Vencimento</th><th class="l">Cliente</th>
          <th class="l">Contato</th><th>Valor</th><th>Parc.</th>
          <th class="l">SAN</th><th class="l">Negociado em</th>
        </tr></thead><tbody>
        ${L.map(a=>{const[t,c]=selo(a.vence_em);return `<tr>

          <td class="n">${a.parcelas??'—'}${a.desconto!=null?`<div style="font-size:9.5px;color:var(--faint);margin-top:2px">${pc(a.desconto,0)} desc.</div>`:''}</td>
          <td class="l" style="font-size:10px;color:var(--dim)">${esc(a.san||'—')}</td>

/* ---------- relatos das monitorias (bloco criptografado) ---------- */
if(QMx && QMx.relatos && document.getElementById('q-go')){
  const bt=document.getElementById('q-go'), inp=document.getElementById('q-pw'), msg=document.getElementById('q-msg');
  const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
  async function abrirRel(){
    const senha=inp.value;
    if(!senha){msg.textContent='Digite a senha';msg.className='msg err';return;}
    bt.disabled=true; inp.disabled=true; msg.textContent='Abrindo…'; msg.className='msg';
    await new Promise(r=>setTimeout(r,40));
    let R;
    try{
      const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(QMx.relatos.salt),iterations:QMx.relatos.it,hash:'SHA-256'},
        km,{name:'AES-GCM',length:256},false,['decrypt']);
      R=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(QMx.relatos.iv)},key,b64(QMx.relatos.ct))));
    }catch(e){bt.disabled=false;inp.disabled=false;inp.value='';msg.textContent='Senha incorreta';msg.className='msg err';inp.focus();return;}
    document.getElementById('q-cad').remove();
    Object.entries(R).forEach(([i,t])=>{const el=document.getElementById('rel-'+i);
      if(el) el.innerHTML=`<h5 style="margin-top:0">Relato da ligação</h5><p>${esc(t)}</p>`;});
  }
  bt.addEventListener('click',abrirRel);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')abrirRel();});
}

if(EX && document.getElementById('ex-add')){
  document.getElementById('ex-add').onclick=exAdd;
  document.getElementById('ex-san').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase();});
  exRender();
}

/* simulador */
const sl=document.getElementById('sl'), sv=document.getElementById('sv'), so=document.getElementById('so');
function sim(){
  const alvo=+sl.value/100, extra=P.negociado*(alvo-P.conversao);
  sv.textContent=pc(alvo,0);
  if(extra<1){so.className='sim-out zero';
    so.innerHTML=`<div class="big n">R$ 0</div><div class="sub">Arraste a barra para simular</div>`;return;}
  const porDia=extra/D.datas.length;
  so.className='sim-out';
  so.innerHTML=`<div class="big n">+ ${brl(extra)}</div>
    <div class="sub">é o que você receberia a mais no período fechando <b style="color:#E8EFF7">${pc(alvo,0)}</b>
      em vez de ${pc(P.conversao,0)} — cerca de <b style="color:#E8EFF7">${brl(porDia)}</b> por dia,
      no mesmo volume que você já negocia.</div>`;
}
sl.addEventListener('input',sim);
})();
