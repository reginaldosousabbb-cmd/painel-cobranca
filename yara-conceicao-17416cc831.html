<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seu Painel · Yara Conceição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B12;--panel:#0C121C;--panel2:#101827;--panel3:#16202F;
  --line:#1A2433;--line2:#243247;
  --amber:#FFB020;--cyan:#22D3EE;--green:#34D399;--red:#F43F5E;--violet:#A78BFA;
  --txt:#E8EFF7;--dim:#7C8FA6;--faint:#48596E;
  --mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(900px 420px at 85% -6%,rgba(255,176,32,.045),transparent 62%),
  radial-gradient(700px 380px at 5% 104%,rgba(34,211,238,.035),transparent 60%),var(--bg);
  color:var(--txt);font-family:var(--mono);font-size:13px;-webkit-font-smoothing:antialiased;min-height:100vh}
::selection{background:rgba(255,176,32,.3)}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 64px}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.n{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.prose{font-family:var(--sans);letter-spacing:0;text-transform:none}

/* header */
.hd{border-bottom:1px solid var(--line);padding:18px 0 16px;margin-bottom:20px}
.hd-t{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hd-mk{width:38px;height:38px;flex:none;border:1px solid var(--amber);color:var(--amber);
  background:rgba(255,176,32,.07);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.hd-i h1{font-size:16px;font-weight:700;letter-spacing:.03em}
.hd-i h1 em{font-style:normal;color:var(--amber)}
.hd-m{display:flex;gap:9px;align-items:center;margin-top:5px;flex-wrap:wrap}
.hd-m span{font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}

/* perfil */
.pf{border:1px solid var(--line);background:var(--panel);border-top:2px solid var(--acc);
  padding:22px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.pf-av{width:60px;height:60px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;background:var(--accbg);color:var(--acc);border:1px solid var(--accbd)}
.pf-i h2{font-size:21px;font-weight:700;letter-spacing:.02em}
.pf-i .m{display:flex;gap:9px;align-items:center;margin-top:7px;flex-wrap:wrap;
  font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.pf-s{margin-left:auto;text-align:right}
.pf-s .v{font-size:42px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--acc)}
.pf-s .l{font-size:9px;letter-spacing:.15em;margin-top:6px;color:var(--acc);font-weight:700}
.pf-s .c{font-size:8.5px;letter-spacing:.1em;color:var(--faint);margin-top:4px}

.tag{font-size:8.5px;font-weight:700;letter-spacing:.1em;padding:2px 7px;text-transform:uppercase}
.tag.m{color:var(--cyan);background:rgba(34,211,238,.1)}
.tag.t{color:var(--amber);background:rgba(255,176,32,.1)}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);background:var(--line);gap:1px;margin-top:16px}
.k{background:var(--panel);padding:14px 15px 12px;position:relative;overflow:hidden;min-height:98px}
.k .l{font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
.k .v{font-size:21px;font-weight:700;margin-top:9px;line-height:1;letter-spacing:-.025em}
.k .d{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;margin-top:8px;font-weight:700}
.k .d.up{color:var(--green)}.k .d.dn{color:var(--red)}.k .d.eq{color:var(--dim)}
.k .sp{position:absolute;left:0;right:0;bottom:0;opacity:.85;pointer-events:none}

/* painel */
.pn{border:1px solid var(--line);background:var(--panel);margin-top:16px}
.pn-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pn-h h3{font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.pn-h .nt{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.pn-b{padding:18px 16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g21{display:grid;grid-template-columns:1.7fr 1fr;gap:16px}

/* destaque */
.hi{border:1px solid var(--accbd);background:linear-gradient(100deg,var(--accbg),transparent 62%);
  padding:18px 20px;display:flex;gap:16px;align-items:flex-start;margin-top:16px}
.hi .ic{font-size:9px;font-weight:700;letter-spacing:.16em;color:var(--acc);white-space:nowrap;padding-top:3px;width:76px;flex:none}
.hi h4{font-size:13px;font-weight:700;letter-spacing:.03em;margin-bottom:7px}
.hi p{font-family:var(--sans);font-size:13px;line-height:1.65;color:var(--dim)}
.hi p b{color:var(--txt);font-weight:600}
.hi p .hl{font-family:var(--mono);color:var(--acc);font-weight:700}

/* 10 clientes */
.dez{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.dez i{width:30px;height:38px;display:flex;align-items:center;justify-content:center;
  font-size:15px;border:1px solid var(--line2)}
.dez i.on{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.45);color:var(--green)}
.dez i.off{background:var(--panel3);color:var(--faint)}

/* barras */
.bar{display:flex;align-items:center;gap:11px;padding:6px 0}
.bar .l{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);width:104px;flex:none}
.bar .t{flex:1;height:9px;background:var(--panel3)}
.bar .t i{display:block;height:100%;animation:gw .8s cubic-bezier(.2,.8,.3,1) both;transform-origin:left}
.bar .v{font-size:11.5px;font-weight:700;width:44px;text-align:right}
.bar .w{font-size:9px;color:var(--faint);width:30px;text-align:right}
@keyframes gw{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* simulador */
.sim-r{display:flex;align-items:center;gap:14px;margin:6px 0 16px;flex-wrap:wrap}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:200px;height:5px;background:var(--panel3);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;background:var(--amber);cursor:pointer;border:2px solid #070B12}
input[type=range]::-moz-range-thumb{width:19px;height:19px;background:var(--amber);cursor:pointer;border:2px solid #070B12}
.sim-v{font-size:20px;font-weight:800;color:var(--amber);width:78px;text-align:right}
.sim-out{border:1px solid var(--line2);background:var(--panel2);padding:16px 18px;text-align:center}
.sim-out .big{font-size:31px;font-weight:800;color:var(--green);letter-spacing:-.02em;line-height:1.1}
.sim-out .sub{font-family:var(--sans);font-size:12px;color:var(--dim);margin-top:8px;line-height:1.55}
.sim-out.zero .big{color:var(--dim)}

/* diagnostico */
.dg{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1px solid var(--line);
  background:var(--panel2);margin-bottom:9px;border-left:2px solid var(--c)}
.dg .i{font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--c);width:60px;flex:none;padding-top:2px}
.dg p{font-family:var(--sans);font-size:12.5px;line-height:1.6;color:var(--dim)}
.dg p b{color:var(--txt);font-weight:600}

/* proximo passo */
.np{border:1px solid rgba(255,176,32,.35);background:linear-gradient(100deg,rgba(255,176,32,.1),transparent 60%);
  padding:22px 24px;margin-top:16px}
.np .t{font-size:9px;font-weight:700;letter-spacing:.17em;color:var(--amber);margin-bottom:10px}
.np h3{font-size:16px;font-weight:700;letter-spacing:.02em;margin-bottom:9px}
.np p{font-family:var(--sans);font-size:13px;line-height:1.65;color:var(--dim)}
.np p b{color:var(--txt);font-weight:600}

.ft{margin-top:26px;padding:15px 18px;border:1px dashed var(--line2);
  font-family:var(--sans);font-size:11px;line-height:1.7;color:var(--faint)}

/* ---- abas ---- */
.abas{display:flex;gap:0;border-bottom:1px solid var(--line);margin:20px 0 0}
.abas button{padding:11px 18px;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--faint);background:none;border:none;
  border-bottom:2px solid transparent;cursor:pointer;transition:.15s}
.abas button:hover{color:var(--dim)}
.abas button.on{color:var(--amber);border-bottom-color:var(--amber)}
.abas .cnt{margin-left:7px;background:var(--amber);color:#0A0703;font-size:8.5px;padding:1px 5px;font-weight:800}
.vista{display:none}.vista.on{display:block;animation:rise .25s ease both}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---- cadeado dos acordos ---- */
.cad{border:1px solid var(--line);background:var(--panel);border-top:2px solid var(--amber);
  padding:30px;max-width:430px;margin:20px auto;text-align:center}
.cad h3{font-size:12px;font-weight:700;letter-spacing:.05em;margin-bottom:8px}
.cad p{font-family:var(--sans);font-size:12px;line-height:1.6;color:var(--dim);margin-bottom:18px}
.cad input{width:100%;background:#070B12;border:1px solid var(--line2);color:var(--txt);
  font-family:var(--mono);font-size:14px;letter-spacing:.2em;padding:12px;text-align:center}
.cad input:focus{outline:none;border-color:var(--amber)}
.cad button{width:100%;margin-top:12px;background:var(--amber);color:#0A0703;padding:12px;
  border:none;font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;cursor:pointer}
.cad .msg{min-height:15px;margin-top:11px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.cad .msg.err{color:var(--red)}

/* ---- tabela de acordos ---- */
.acd{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
.acd th{font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
  text-align:right;padding:0 9px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.acd th:first-child,.acd th.l{text-align:left}
.acd td{padding:9px;border-bottom:1px solid rgba(26,36,51,.6);text-align:right;white-space:nowrap}
.acd td:first-child,.acd td.l{text-align:left}
.acd tbody tr:hover td{background:rgba(255,176,32,.04)}
.urg{font-size:8.5px;font-weight:700;letter-spacing:.08em;padding:2px 7px;text-transform:uppercase}
.urg.hoje{background:rgba(244,63,94,.14);color:var(--red)}
.urg.venc{background:rgba(167,139,250,.14);color:var(--violet)}
.urg.prox{background:rgba(255,176,32,.13);color:var(--amber)}
.urg.ok{background:rgba(52,211,153,.13);color:var(--green)}

/* ---- contatos ---- */
.fones{display:flex;flex-direction:column;gap:5px}
.fone{display:flex;align-items:center;gap:5px}
.fone .nb{font-size:11px;color:var(--txt);min-width:104px}
.fone a{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;
  border:1px solid var(--line2);text-decoration:none;font-size:11px;transition:.15s}
.fone a.wa{color:#25D366}
.fone a.wa:hover{background:rgba(37,211,102,.14);border-color:#25D366}
.fone a.tel{color:var(--cyan)}
.fone a.tel:hover{background:rgba(34,211,238,.14);border-color:var(--cyan)}


/* ---- detalhamento diario ---- */
.dias{display:flex;flex-direction:column;gap:0}
.dia-row{display:grid;grid-template-columns:128px 1fr 100px 62px;gap:12px;align-items:center;
  padding:10px 0;border-bottom:1px solid rgba(26,36,51,.6)}
.dia-row:last-child{border-bottom:none}
.dia-row.media{border-top:1px solid var(--line2);margin-top:4px;padding-top:14px;border-bottom:none}
.dia-data{font-size:11px;color:var(--dim)}
.dia-data b{color:var(--txt);font-weight:600}
.dia-t{height:9px;background:var(--panel3);position:relative}
.dia-t i{display:block;height:100%;animation:gw .7s cubic-bezier(.2,.8,.3,1) both}
.dia-v{font-size:13px;font-weight:700;text-align:right}
.dia-d{font-size:10px;font-weight:700;text-align:right}
.dia-d.up{color:var(--green)}.dia-d.dn{color:var(--red)}.dia-d.eq{color:var(--faint)}

svg text{font-family:var(--mono)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.g2,.g21{grid-template-columns:1fr}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.pf-s{margin-left:0}}
</style>
</head>

<script>
(function(){
'use strict';
const D=JSON.parse(document.getElementById('dd').textContent);
const T=D.equipe, P=D.pessoa;

const _b0=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const _b2=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});
const _nf=new Intl.NumberFormat('pt-BR');
const brl=v=>_b0.format(v||0), brl2=v=>_b2.format(v||0), nf=v=>_nf.format(Math.round(v||0));
const pc=(v,d=1)=>(v*100).toFixed(d).replace('.',',')+'%';
const kb=v=>'R$'+(Math.abs(v)>=1000?(v/1000).toFixed(0)+'k':Math.round(v));
const tm=s=>s==null?'—':String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.round(s%60)).padStart(2,'0');
const ini=f=>{const p=f.split(' ').filter(Boolean);return((p[0]?.[0]||'')+(p[p.length-1]?.[0]||'')).toUpperCase()};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const sum=a=>a.reduce((x,y)=>x+y,0), avg=a=>a.length?sum(a)/a.length:0;

/* faixa de performance — linguagem para quem recebe, não veredito */
const faixa = P.score>=85?{t:'EXCELENTE',c:'#34D399'}
            : P.score>=70?{t:'BOM',c:'#22D3EE'}
            : P.score>=50?{t:'EM EVOLUÇÃO',c:'#FFB020'}
                         :{t:'EM DESENVOLVIMENTO',c:'#A78BFA'};
const acc=faixa.c;
const rgba=(h,a)=>{h=h.replace('#','');return`rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`};
document.documentElement.style.setProperty('--acc',acc);
document.documentElement.style.setProperty('--accbg',rgba(acc,.11));
document.documentElement.style.setProperty('--accbd',rgba(acc,.4));

/* ---------- gráficos SVG ---------- */
let uid=0; const nid=()=>'g'+(++uid);
function spark(d,c,w=250,h=32){
  if(!d.length)return'';
  const hi=Math.max(...d)||1, X=i=>i*w/(d.length-1||1), Y=v=>h-2-(v/hi)*(h-6);
  const p=d.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' '), g=nid();
  return`<svg class="sp" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" height="${h}" style="width:100%">
   <defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="${c}" stop-opacity=".3"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
   <polygon points="0,${h} ${p} ${w},${h}" fill="url(#${g})"/>
   <polyline points="${p}" fill="none" stroke="${c}" stroke-width="1.4"/></svg>`;
}
function barras({labels,series,w=760,h=290}){
  const pad={t:34,r:14,b:34,l:12}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const n=labels.length;
  // com poucos dias (inicio do mes) da pra escrever o valor em cima de cada
  // barra; com muitos dias isso vira poluicao — nesse caso some com os
  // rotulos individuais e deixa so a barra + tooltip ao passar o mouse.
  const denso = n>12;
  const hi=(Math.max(...series.flatMap(s=>s.data))||1)*(denso?1.14:1.28);
  const grupo=iw/n, largBarra=denso?Math.max(2,Math.min(9,grupo/(series.length+1)))
                                  :Math.min(22,grupo/(series.length+1.6));
  const Y=v=>pad.t+ih-(v/hi)*ih;
  let s='';
  for(let i=0;i<=3;i++){const v=hi*i/3,y=Y(v);
    s+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w-pad.r}" y2="${y.toFixed(1)}" stroke="#1A2433"/>`;
    if(denso) s+=`<text x="${pad.l}" y="${(y-3).toFixed(1)}" fill="#48596E" font-size="8">${kb(v)}</text>`;}
  const passoRotulo = denso ? Math.ceil(n/9) : 1;
  labels.forEach((l,i)=>{
    const cx=pad.l+grupo*i+grupo/2;
    if(i%passoRotulo===0 || i===n-1)
      s+=`<text x="${cx.toFixed(1)}" y="${h-9}" fill="#7C8FA6" font-size="${denso?9:10}" font-weight="700" text-anchor="middle">${l}</text>`;
    series.forEach((se,si)=>{
      const v=se.data[i]||0;
      const bh=Math.max(1,(v/hi)*ih);
      const bx=cx - (series.length*largBarra)/2 + si*largBarra + (denso?0.6:1.5);
      const by=pad.t+ih-bh;
      s+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${(largBarra-(denso?1.2:3)).toFixed(1)}" height="${bh.toFixed(1)}"
        fill="${se.color}" rx="${denso?1:2.5}"><title>${l} · ${se.name}: ${brl(v)}</title></rect>`;
      if(v>0 && !denso){
        const rotulo = v>=1000 ? (v/1000).toFixed(1).replace('.0','')+'k' : String(Math.round(v));
        s+=`<text x="${(bx+(largBarra-3)/2).toFixed(1)}" y="${(by-5).toFixed(1)}" fill="${se.color}"
          font-size="9.5" font-weight="700" text-anchor="middle">${rotulo}</text>`;
      }
    });
  });
  let lx=pad.l;
  series.forEach(se=>{s+=`<rect x="${lx}" y="8" width="9" height="2.5" fill="${se.color}"/>
    <text x="${lx+14}" y="13" fill="#7C8FA6" font-size="9" letter-spacing=".13em">${se.name.toUpperCase()}</text>`;
    lx+=26+se.name.length*6.6;});
  if(denso) s+=`<text x="${w-pad.r}" y="20" fill="#48596E" font-size="8.5" text-anchor="end">passe o mouse p/ ver o valor</text>`;
  return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">${s}</svg>`;
}

function vs(meu,ref,maiorMelhor=true){
  if(!ref) return{cls:'eq',txt:'—'};
  const d=(meu-ref)/ref, bom=maiorMelhor?d>0:d<0;
  if(Math.abs(d)<0.03) return{cls:'eq',txt:'na média do time'};
  return{cls:bom?'up':'dn', txt:(d>0?'▲ ':'▼ ')+pc(Math.abs(d),0)+' vs. média'};
}
function kpi(l,v,cmp,sp,spc){
  return`<div class="k"><div class="l">${l}</div><div class="v n">${v}</div>
    ${cmp?`<div class="d ${cmp.cls}">${cmp.txt}</div>`:''}
    ${sp?`<div class="sp">${spark(sp,spc)}</div>`:''}</div>`;
}

/* ---------- diagnóstico em segunda pessoa ---------- */
function diagnostico(){
  const o=[];
  const add=(tag,c,html)=>o.push({tag,c,html});
  const convCli=P.clientes_recebidos/P.clientes_negociados;
  const gap=convCli-P.conversao;

  if(P.observacao) add('CONTEXTO','#A78BFA',P.observacao);

  /* o insight mais acionável: cliente x valor */
  if(gap>0.06)
    add('FOCO','#FFB020',`<b>${pc(convCli,0)} dos clientes</b> que você negocia acabam pagando, mas isso representa só
      <b>${pc(P.conversao,0)} do valor</b>. Os acordos que não se concretizam são justamente os
      <b>de ticket mais alto</b>. Ganhar aqui não exige negociar mais gente — exige cuidado redobrado
      no fechamento dos acordos grandes.`);
  else if(gap<-0.06)
    add('PONTO FORTE','#34D399',`Você converte <b>${pc(P.conversao,0)} do valor</b> negociado, acima da sua conversão de
      clientes (${pc(convCli,0)}). Isso significa que <b>seus acordos grandes se sustentam</b> — é exatamente o
      comportamento mais difícil de conseguir em cobrança.`);

  if(P.conversao>=T.conversao+0.08)
    add('PONTO FORTE','#34D399',`Sua conversão de <b>${pc(P.conversao)}</b> está <b>${pc(P.conversao-T.conversao,1)} acima</b>
      da média da operação (${pc(T.conversao)}). Você fecha melhor do que a maior parte do time.`);
  else if(P.conversao<=T.conversao-0.08)
    add('OPORTUNIDADE','#FFB020',`Sua conversão está em <b>${pc(P.conversao)}</b>, contra ${pc(T.conversao)} da média da operação.
      É o indicador com maior espaço de ganho no seu resultado hoje.`);

  if(P.chamadas>=T.chamadas_pessoa*1.15)
    add('VOLUME','#22D3EE',`Você fez <b>${nf(P.chamadas)} chamadas</b>, acima da média de ${nf(T.chamadas_pessoa)} por pessoa.
      Esforço não é o seu gargalo.`);
  else if(P.chamadas<=T.chamadas_pessoa*0.85)
    add('VOLUME','#FFB020',`Você fez <b>${nf(P.chamadas)} chamadas</b>, abaixo da média de ${nf(T.chamadas_pessoa)} por pessoa.
      Com a sua taxa de conversão atual, cada bloco de chamadas a mais tende a virar resultado.`);

  if(P.tma_seg>T.tma_seg*1.25)
    add('TEMPO','#FFB020',`Seu TMA é <b>${tm(P.tma_seg)}</b>, contra ${tm(T.tma_seg)} da equipe. Nem sempre é ruim —
      atendimento mais longo pode significar negociação mais cuidadosa. Vale checar se o tempo extra
      está virando acordo ou se está preso em ligações que não avançam.`);
  else if(P.tma_seg<T.tma_seg*0.8 && P.conversao<T.conversao)
    add('TEMPO','#FFB020',`Seu TMA é <b>${tm(P.tma_seg)}</b>, bem abaixo dos ${tm(T.tma_seg)} da equipe, e sua conversão está
      abaixo da média. A combinação sugere ligações encerradas antes de explorar todas as opções de acordo.`);

  if(P.pausa_pct>20)
    add('DISCIPLINA','#F43F5E',`Sua pausa sobre tempo logado está em <b>${P.pausa_pct.toFixed(1).replace('.',',')}%</b>,
      contra ${T.pausa_pct.toFixed(1).replace('.',',')}% da operação. É tempo de contato que deixa de existir.`);

  if(P.tendencia>=0.15)
    add('TENDÊNCIA','#34D399',`Você <b>subiu ${pc(P.tendencia,0)}</b> na média diária de recebimento entre a 1ª e a 2ª metade
      do período. O que mudou na sua rotina vale ser mantido.`);
  else if(P.tendencia<=-0.15)
    add('TENDÊNCIA','#FFB020',`Sua média diária de recebimento <b>caiu ${pc(Math.abs(P.tendencia),0)}</b> da 1ª para a 2ª metade
      do período. Vale olhar o que era diferente nos primeiros dias.`);

  if(P.cv>0.55)
    add('CONSTÂNCIA','#FFB020',`Seus dias variam bastante: a média é ${brl(P.media_dia)} e seu melhor dia foi
      <b>${brl(P.melhor_valor)}</b> (${P.melhor_dia}). Reduzir a oscilação costuma render mais que
      buscar um dia excepcional — <b>a regularidade é o que sustenta o mês</b>.`);
  else if(P.cv<0.35)
    add('CONSTÂNCIA','#34D399',`Seus resultados são <b>regulares</b> ao longo do mês, com pouca oscilação entre os dias.
      Constância é uma vantagem real: torna o resultado previsível.`);

  if(P.ticket_medio>=T.ticket_medio*1.15)
    add('TICKET','#22D3EE',`Seu ticket médio de <b>${brl2(P.ticket_medio)}</b> está acima dos ${brl2(T.ticket_medio)} da operação —
      você trabalha acordos de valor mais alto que a média.`);

  if(!o.length) add('RESUMO','#22D3EE','Seus indicadores estão dentro da faixa da equipe, sem desvios relevantes no período.');
  return o;
}

/* ---------- próximo passo: uma ação só, a de maior alavanca ---------- */
function proximoPasso(){
  const convCli=P.clientes_recebidos/P.clientes_negociados, gap=convCli-P.conversao;
  const alvo=Math.min(0.95,Math.max(P.conversao+0.05,T.conversao));
  const ganho=P.negociado*(alvo-P.conversao);
  if(P.pausa_pct>20) return{t:'Recuperar tempo de operação',
    p:`Sua pausa está em <b>${P.pausa_pct.toFixed(1).replace('.',',')}%</b> do tempo logado, contra ${T.pausa_pct.toFixed(1).replace('.',',')}% da operação.
       Trazer esse número para o patamar do time devolve tempo de contato sem exigir nada além do que você já faz.`};
  if(gap>0.06) return{t:'Blindar os acordos de maior valor',
    p:`Você já leva <b>${pc(convCli,0)} dos clientes</b> ao pagamento — a técnica de negociação funciona. A perda está concentrada
       nos acordos de <b>ticket mais alto</b>. Nesses casos, confirme data, forma de pagamento e envie o lembrete antes do vencimento.
       Subir sua conversão de valor para ${pc(alvo,0)} representa <b>${brl(ganho)}</b> a mais no mês.`};
  if(P.conversao<T.conversao) return{t:'Fechar com mais firmeza',
    p:`Sua conversão está ${pc(T.conversao-P.conversao,1)} abaixo da média da operação. Chegar a ${pc(alvo,0)} — o patamar do time —
       representa <b>${brl(ganho)}</b> a mais no mês, <b>sem precisar negociar um cliente sequer a mais</b>.`};
  if(P.chamadas<T.chamadas_pessoa*0.9) return{t:'Ampliar o volume de contato',
    p:`Sua conversão de <b>${pc(P.conversao)}</b> está acima da média, mas seu volume de chamadas está abaixo.
       Você converte bem o que toca — tocar mais é o caminho mais curto para crescer.`};
  if(P.cv>0.55) return{t:'Transformar o pico em rotina',
    p:`Seu melhor dia foi <b>${brl(P.melhor_valor)}</b> e sua média é ${brl(P.media_dia)}. Você já provou que consegue.
       Repetir a rotina daquele dia com regularidade vale mais que buscar um novo recorde.`};
  return{t:'Manter e documentar o que funciona',
    p:`Seus indicadores estão acima da operação em praticamente todas as dimensões. O maior ganho agora é
       <b>registrar sua abordagem</b> para que ela vire referência para o time.`};
}

function detalheDias(){
  const dr=P.daily_recebido, dt=D.datas;
  // ultimos dias com QUALQUER negociacao aberta no periodo (nao conta os
  // que ficaram zerados por fim de semana/feriado sem expediente)
  const idx=[];
  for(let i=dr.length-1;i>=0 && idx.length<5;i--){
    if((P.daily_negociado[i]||0)>0 || (dr[i]||0)>0) idx.push(i);
  }
  idx.reverse();
  if(!idx.length) return '<p class="prose" style="color:var(--dim);font-size:12.5px">Sem dias com movimento neste período.</p>';

  const media=P.media_dia||0;
  const maxV=Math.max(media, ...idx.map(i=>dr[i]||0), 1);
  const linha=(rotulo,valor,destaque)=>{
    const v=valor||0;
    const diff = media>0 ? (v-media)/media : 0;
    const cls = Math.abs(diff)<0.05?'eq':diff>0?'up':'dn';
    const seta = cls==='up'?'▲':cls==='dn'?'▼':'▬';
    const cor = destaque ? '#FFB020' : (v>=media ? '#34D399' : '#7C8FA6');
    return `<div class="dia-row${destaque?' media':''}">
      <span class="dia-data">${rotulo}</span>
      <span class="dia-t"><i style="width:${Math.min(100,v/maxV*100)}%;background:${cor}"></i></span>
      <span class="dia-v n" style="color:${destaque?'#FFB020':'inherit'}">${brl(v)}</span>
      <span class="dia-d n ${cls}">${destaque?'':seta+' '+pc(Math.abs(diff),0)}</span>
    </div>`;
  };

  let html='<div class="dias">';
  idx.forEach((i,k)=>{
    const rot = k===idx.length-1 ? `<b>${dt[i]} · hoje</b>` : dt[i];
    html+=linha(rot, dr[i]);
  });
  html+=linha('MÉDIA DO PERÍODO', media, true);
  html+='</div>';
  html+=`<p class="prose" style="font-size:11.5px;line-height:1.6;color:var(--faint);margin-top:14px">
    A seta compara cada dia com a sua própria média — não com colegas. Dias sem negociação
    aberta (fim de semana ou folga) não entram nesta lista.</p>`;
  return html;
}

/* ---------- acordos (bloco criptografado) ---------- */
if(D.acordos_qtd){
  const cad=document.getElementById('acd-cad'), inp=document.getElementById('acd-pw'),
        bt=document.getElementById('acd-go'), msg=document.getElementById('acd-msg'),
        alvo=document.getElementById('acd-lista');
  const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));

  function hojeISO(){const d=new Date();return [d.getFullYear(),d.getMonth()+1,d.getDate()];}
  function partes(br){ if(!br) return null; const[d,m,y]=br.split('/').map(Number); return [y,m,d]; }
  function diasAte(br){
    const p=partes(br); if(!p) return null;
    const a=new Date(p[0],p[1]-1,p[2]), h=hojeISO();
    return Math.round((a-new Date(h[0],h[1]-1,h[2]))/86400000);
  }
  function selo(br){
    const d=diasAte(br);
    if(d===null) return ['—','ok'];
    if(d<0)  return ['vencido há '+Math.abs(d)+'d','venc'];
    if(d===0) return ['vence hoje','hoje'];
    if(d<=3) return ['em '+d+'d','prox'];
    return ['em '+d+'d','ok'];
  }

  async function abrir(){
    const senha=inp.value;
    if(!senha){ msg.textContent='Digite a senha'; msg.className='msg err'; return; }
    bt.disabled=true; inp.disabled=true;
    msg.textContent='Abrindo…'; msg.className='msg';
    await new Promise(r=>setTimeout(r,40));
    let lista;
    try{
      const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey(
        {name:'PBKDF2',salt:b64(D.acordos.salt),iterations:D.acordos.it,hash:'SHA-256'},
        km,{name:'AES-GCM',length:256},false,['decrypt']);
      const plano=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.acordos.iv)},key,b64(D.acordos.ct));
      lista=JSON.parse(new TextDecoder().decode(plano));
    }catch(e){
      bt.disabled=false; inp.disabled=false; inp.value='';
      msg.textContent='Senha incorreta'; msg.className='msg err'; inp.focus(); return;
    }
    cad.remove(); render(lista);
  }

  function fones(a){
    const L=a.telefones||[];
    if(!L.length) return '<span style="color:var(--faint);font-size:10.5px">sem telefone</span>';
    const msg = encodeURIComponent('Olá ' + (a.cliente||'').split(' ')[0]
      + ', tudo bem? Sou da cobrança da HUBMAIS e estou entrando em contato sobre o seu acordo.');
    return '<div class="fones">' + L.map(f=>`<div class="fone">
      <span class="nb n">${f.exibir}</span>
      <a class="wa" href="https://wa.me/${f.link}?text=${msg}" target="_blank" rel="noopener"
         title="Abrir conversa no WhatsApp">✆</a>
      <a class="tel" href="tel:+${f.link}" title="Ligar">☏</a>
    </div>`).join('') + '</div>';
  }

  function render(L){
    const total=L.reduce((a,b)=>a+(b.valor||0),0);
    const vencidos=L.filter(a=>{const d=diasAte(a.vence_em); return d!==null&&d<0;}).length;
    const hoje=L.filter(a=>diasAte(a.vence_em)===0).length;
    alvo.innerHTML=`
      <div class="kpis" style="grid-template-columns:repeat(4,1fr);margin-top:0">
        ${kpi('Acordos na sua carteira',nf(L.length))}
        ${kpi('Valor negociado',brl(total))}
        ${kpi('Vencem hoje',nf(hoje))}
        ${kpi('Já vencidos',nf(vencidos))}
      </div>
      <div class="pn"><div class="pn-h"><h3>Seus acordos</h3>
        <span class="nt">ordenados por vencimento</span></div>
        <div class="pn-b" style="overflow-x:auto">
        <table class="acd"><thead><tr>
          <th class="l">Vencimento</th><th class="l">Cliente</th>
          <th class="l">Contato</th><th>Valor</th><th>Parc.</th>
          <th class="l">SAN</th><th class="l">Negociado em</th>
        </tr></thead><tbody>
        ${L.map(a=>{const[t,c]=selo(a.vence_em);return `<tr>
          <td class="l"><span class="urg ${c}">${t}</span>
            <div style="font-size:10px;color:var(--faint);margin-top:3px">${a.vence_em||'—'}</div></td>
          <td class="l" style="font-weight:600">${esc(a.cliente||'—')}</td>
          <td class="l">${fones(a)}</td>
          <td class="n" style="font-weight:700">${brl2(a.valor||0)}</td>
          <td class="n">${a.parcelas??'—'}${a.desconto!=null?`<div style="font-size:9.5px;color:var(--faint);margin-top:2px">${pc(a.desconto,0)} desc.</div>`:''}</td>
          <td class="l" style="font-size:10px;color:var(--dim)">${esc(a.san||'—')}</td>
          <td class="l" style="color:var(--dim)">${a.negociado_em||'—'}</td>
        </tr>`;}).join('')}
        </tbody></table></div></div>
      <div class="ft" style="margin-top:16px"><b>Como usar:</b> comece pelos que estão em
        vermelho e laranja — vencidos e vencendo hoje. Confirme se o cliente recebeu o boleto,
        combine a forma de pagamento e registre o contato. Um acordo que vence sem pagamento
        vira quebra e não conta como recebimento.
        <br><br><b>Dados de cliente:</b> use somente para o trabalho de cobrança. Não
        encaminhe esta tela nem tire print.</div>`;
  }

  bt.addEventListener('click',abrir);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') abrir(); });

    so.innerHTML=`<div class="big n">R$ 0</div><div class="sub">Arraste a barra para simular</div>`;return;}
  const porDia=extra/D.datas.length;

    <div class="sub">é o que você receberia a mais no período fechando <b style="color:#E8EFF7">${pc(alvo,0)}</b>
      em vez de ${pc(P.conversao,0)} — cerca de <b style="color:#E8EFF7">${brl(porDia)}</b> por dia,
      no mesmo volume que você já negocia.</div>`;
}
